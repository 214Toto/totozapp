<head>

    <style>
        :root {
            --primary: #1a6b6b;
            --accent: #2d9b9b;
            --dark: #0f2b2b;
            --light: #f6fafa;

            --shadow: 0 4px 14px rgba(10, 40, 40, 0.07);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {

            color: var(--dark);

            padding-top: 80px;
        }
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: linear-gradient(135deg, var(--primary), var(--dark));
            color: #fff;
            padding: 0.7rem 0;
            box-shadow: 0 6px 18px rgba(8, 30, 30, 0.20);

            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .logo i { font-size: 1.5rem; color: var(--accent); }
        .logo h1 {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            margin: 0;
            line-height: 1;
        }
        .badge {
            background: rgba(255,255,255,0.13);

            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            color: #cae6e6;
        }

            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1.25rem 2.5rem;
        }
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            margin: 1.8rem 0 1rem 0;
            padding-bottom: 0.4rem;

            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;

            font-weight: 600;
            background: var(--primary);
            color: #fff;
            border-radius: 40px;

            font-weight: 600;
            font-size: 0.97rem;
            margin-bottom: 0.5rem;
            color: var(--dark);
            line-height: 1.5;
        }
        .question .q-badge {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            border-radius: 40px;
            padding: 0 0.7rem;
            font-size: 0.7rem;
            font-weight: 700;
            line-height: 1.6;
            margin-right: 0.4rem;
        }
        .options label {
            display: block;
            background: #fafdfd;
            border: 1px solid #dde8ec;
            border-radius: 8px;
            padding: 0.4rem 0.85rem;
            margin-top: 0.4rem;
            cursor: pointer;
            transition: 0.15s ease;
            font-weight: 450;
            font-size: 0.93rem;
        }
        .options label:hover {
            background: #e6f3f3;
            border-color: var(--accent);

            margin-right: 0.5rem;
            accent-color: var(--primary);

        }
        .question-feedback {
            margin-top: 0.8rem;
            padding: 0.3rem 0 0.1rem 0;
            border-top: 1px dashed #d5e3e3;
        }
        .answer-block strong {
            display: block;
            margin-bottom: 4px;
            color: var(--primary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

            display: flex;
            flex-direction: column;
            gap: 3px;

            background: #ebfaf3;
            border-color: #b5e6cc;
            color: #065f46;
        }
        .answer-wrong {
            background: #fdeeef;
            border-color: #f7b5b5;
            color: #8f1a2e;
        }
        .user-choice {
            outline: 2px dashed rgba(0,0,0,0.06);
        }
        .explanation {
            margin-top: 6px;
            padding: 7px 12px;
            border-radius: 8px;
            background: #f0f8f6;
            color: #065f46;
            font-size: 0.89rem;
            line-height: 1.5;
            border-left: 4px solid var(--accent);
        }
        .explanation.wrong {
            background: #fdf3f4;
            color: #6f1a1a;
            border-left-color: #e07a7a;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            color: #fff;
            border: none;
            padding: 0.6rem 1.6rem;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(26,107,107,0.25);
        }
        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(26,107,107,0.32);
        }
        .btn:active { transform: scale(0.96); }
        .btn i { font-size: 0.9rem; }
        .submit-wrap {
            text-align: center;
            margin: 1.5rem 0 2rem;
        }
        .result {
            margin-top: 1.5rem;
            padding: 1.5rem 1.5rem 1rem;
            background: #eff8f7;
            border-radius: var(--radius);
            text-align: center;
            display: none;
            border: 1px solid #bddcd9;
        }
        .result h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.2rem;
        }
        .score {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--primary);
            margin: 0.2rem 0 0.4rem;
        }
        @media (max-width: 700px) {
            body { padding-top: 72px; }
            .logo h1 { font-size: 0.95rem; }
            .header-inner { padding: 0 1rem; flex-direction: column; align-items: stretch; gap: 0.3rem; }
            .badge { align-self: flex-start; }
            .question { padding: 0.9rem 0.9rem 0.1rem 0.9rem; }
            .section-title { font-size: 1.1rem; }
            .score { font-size: 2.2rem; }
            .btn { padding: 0.5rem 1.2rem; font-size: 0.85rem; }
        }
        .text-muted { color: #4f6f6f; font-size: 0.9rem; }
        .mt-1 { margin-top: 0.8rem; }
        .hidden { display: none !important; }
        .scroll-target { scroll-margin-top: 90px; }
    </style>

    <script>
        // ─── MCQ DATA ───
        // 60 questions as extracted from the PDF (with inferred answers for incomplete questions)
        const mcqData = [
            // 1
            {
                id: 'q1',
                text: 'The following is a long acting barbiturate',
                options: ['A. Pentobarbital', 'B. Flumazenil', 'C. Phenobarbital', 'D. Thiopental', 'E. Buspirone'],

                explanation: 'Phenobarbital is a long-acting barbiturate (half-life > 50 hours). Pentobarbital and thiopental are short/ultra-short.'
            },
            // 2
            {
                id: 'q2',
                text: 'Which of the following drug is short acting benzodiazepine?',

                correct: 'a',
                explanation: 'Midazolam is a short-acting benzodiazepine (t½ ~2–3 h). Diazepam and clonazepam are long-acting.'

            // 3
            {
                id: 'q3',
                text: 'Which of the following drugs is known to cause anterograde amnesia as a notable side effect?',
                options: ['A. Pentobarbital', 'B. Lorazepam', 'C. Thiopental', 'D. Phenobarbitone', 'E. Valproate'],
                correct: 'b',
                explanation: 'Benzodiazepines, especially short-acting ones like lorazepam, can cause anterograde amnesia. Thiopental also but lorazepam is classic.'
            },
            // 4
            {
                id: 'q4',
                text: 'Regarding sedative hypnotics, which of the following is true?',
                options: [
                    'A. Drugs used in anxiety may be used alone without psychotherapy',
                    'B. Therapy of insomnia can be started with or without alternative methods like exercises',
                    'C. Administering low doses for a short period helps prevent drug dependence',
                    'D. Termination of hypnotic therapy can be done at any time',
                    'E. Drug dosage is dependent on the symptoms presenting and can be increased as high as the severity of the symptoms'
                ],
                correct: 'c',
                explanation: 'Low doses for short periods reduce the risk of dependence. Psychotherapy is often needed, and withdrawal should be gradual.'
            },
            // 5
            {
                id: 'q5',
                text: 'Which of the following drugs can cause an additive effect on alcohol?',
                options: ['A. Ketamine', 'B. Atropine', 'C. Thiopental', 'D. Phenytoin', 'E. Carbamazepine'],

                explanation: 'Barbiturates (thiopental) have additive CNS depression with alcohol. Ketamine also but less classic.'
            },
            // 6
            {
                id: 'q6',
                text: 'All the following are used as pre anesthetic drugs EXCEPT',
                options: ['A. Phenobarbital', 'B. Thiopental', 'C. Midazolam', 'D. Diazepam', 'E. Clonazepam'],
                correct: 'a',
                explanation: 'Phenobarbital is a long-acting barbiturate not typically used for premedication; thiopental, midazolam, diazepam, and clonazepam are used.'
            },
            // 7
            {
                id: 'q7',
                text: 'James is found ... alcohol withdrawal syndrome. Which drug will be very useful?',
                options: ['A. Midazolam', 'B. Thiopental', 'C. Lorazepam', 'D. Alprazolam', 'E. Diazepam'],
                correct: 'e',
                explanation: 'Diazepam is the benzodiazepine of choice for alcohol withdrawal due to its long half-life and smooth tapering.'
            },
            // 8
            {
                id: 'q8',
                text: 'Which of the following drug is used in psychotic patients presenting with violent symptoms?',
                options: ['A. Midazolam i.v', 'B. Alprazolam i.v', 'C. Diazepam i.v', 'D. Clonazepam i.v', 'E. Lorazepam i.v'],
                correct: 'e',
                explanation: 'Lorazepam IV is used for rapid tranquilization in agitated psychotic patients. Haloperidol is also used, but among benzos, lorazepam is preferred.'
            },
            // 9
            {
                id: 'q9',
                text: 'The following are selective serotonin re-uptake inhibitors EXCEPT',
                options: ['A. Fluoxetine', 'B. Paroxetine', 'C. Duloxetine', 'D. Sertraline', 'E. Fluvoxamine'],
                correct: 'c',
                explanation: 'Duloxetine is an SNRI (inhibits both serotonin and norepinephrine reuptake); the others are SSRIs.'
            },
            // 10
            {
                id: 'q10',
                text: 'A Mr P aged 45 ... complains of bed wetting ... Which properties would you look for in choosing an appropriate drug for him?',
                options: ['A. Cholinergic activities', 'B. Anticholinergic activities', 'C. Adrenergic activities', 'D. Anti-adrenergic activities', 'E. Dopaminergic activities'],
                correct: 'b',
                explanation: 'Enuresis is treated with anticholinergic drugs (e.g., oxybutynin, imipramine) to relax the bladder detrusor muscle.'
            },
            // 11
            {
                id: 'q11',
                text: 'Which of the following drugs would you take extra caution when prescribing for patients who may already be receiving other drugs for erectile dysfunction?',
                options: ['A. Trazodone', 'B. Venlafaxine', 'C. Maprotiline', 'D. Clomipramine'],
                correct: 'a',
                explanation: 'Trazodone can cause priapism; caution with other drugs affecting erections.'

            // 12
            {
                id: 'q12',
                text: 'Hypertensive crisis, hyperthermia and convulsions are likely to occur with usage of the following drugs',

            // 13

                id: 'q13',
                text: 'With which of the following drugs is it not advised to take Cheese and other lacto products?',

                id: 'q14',

                explanation: 'A washout period of at least 2 weeks is recommended between MAOI and TCA to avoid serotonin syndrome.'

            // 15
            {
                id: 'q15',
                text: 'The following is an example of typical symptoms of depression',
                options: ['A. Hypochondriasis', 'B. Anxieties', 'C. Phobias', 'D. Weight loss', 'E. Obsessions'],
                correct: 'd',
                explanation: 'Weight loss is a somatic symptom of depression; the others are more characteristic of anxiety or OCD.'
            },
            // 16
            {
                id: 'q16',
                text: 'The following drug inhibits the metabolism of biogenic amines like serotonin and noradrenaline',
                options: ['A. Tranylcypromine', 'B. Fluoxetine', 'C. Imipramine', 'D. Fluvoxamine', 'E. Phenelzine'],

                explanation: 'Tranylcypromine (and phenelzine) are MAOIs that inhibit monoamine metabolism. Both are correct but tranylcypromine is listed first.'

            // 17

                id: 'q17',

                explanation: 'Both cause CNS depression; additive effect leads to increased sedation and respiratory depression.'
            },
            // 19
            {
                id: 'q19',
                text: 'Refractory schizophrenia can best be treated with the following drug',
                options: ['A. Olanzapine', 'B. Risperidone', 'C. Haloperidol', 'D. Fluphenazine', 'E. Clozapine'],

                explanation: 'Clozapine is the drug of choice for treatment-resistant schizophrenia.'

            // 20
            {
                id: 'q20',
                text: 'Antipsychotic drugs work by the following mechanism',
                options: ['A. Blockade of D2 receptors in hypothalamus and pituitary', 'B. Blockade of D2 receptors in brain basal ganglia', 'C. Blockade of D2 receptors in brain mesolimbic system', 'D. Blockade of D2 receptors in CTZ', 'E. Inhibition of glutamate'],

                explanation: 'The antipsychotic effect is primarily from D2 blockade in the mesolimbic pathway.'
            },
            // 21
            {
                id: 'q21',
                text: 'Apart from the antipsychotic effects the following drug can be used in the management of CNS induced nausea and vomiting',

            },
            // 22
            {
                id: 'q22',
                text: 'The following statements true EXCEPT',
                options: [
                    'A. Anticholinergics do not worsen psychotic symptoms neither do they increase tardive dyskinesia',
                    'B. Combination of antipsychotic and alcohol enhances additive CNS depression',
                    'C. Anticholinergics reduce the therapeutic effects of Antipsychotics',
                    'D. Clozapine synergistic with other drugs that suppress bone marrow',
                    'E. Drugs that reduce renal clearance increase risk of Lithium toxicity'
                ],
                correct: 'c',
                explanation: 'Anticholinergics do not reduce antipsychotic efficacy; they are used to treat EPS. This statement is false.'
            },
            // 23 - incomplete in PDF, we infer options
            {
                id: 'q23',
                text: 'Manic phase of bipolar can be treated with the following drug',
                options: ['A. Clozapine', 'B. Risperidone', 'C. Chlorpromazine', 'D. Olanzapine', 'E. Fluphenazine'],

                explanation: 'Olanzapine (and other atypicals) are commonly used for acute mania.'

            // 24
            {
                id: 'q24',
                text: 'The following is one of the commonest side effects of antipsychotic drugs',

                explanation: 'EPS is very common with typical antipsychotics due to D2 blockade in the nigrostriatal pathway.'

                id: 'q26',

                explanation: 'Hyperglycemia is less likely to trigger seizures; hypoglycemia (insulin), antipsychotics, meningitis, and TCAs lower seizure threshold.'

            // 27
            {
                id: 'q27',
                text: 'The following is the first line drug treatment for tonic clonic attack (Grand mal)',

            // 28
            {
                id: 'q28',
                text: 'The following drugs works against the breaking down of GABA',

                explanation: 'Valproate inhibits GABA transaminase, reducing GABA breakdown, thus increasing GABA levels.'
            },
            // 29
            {
                id: 'q29',
                text: 'Gingival hypoplasia is side effect of the following drug',
                options: ['A. Gabapentin', 'B. Phenytoin', 'C. Primidone', 'D. Lamotrigine', 'E. Carbamazepine'],

            // 30
            {
                id: 'q30',

            // 31

                id: 'q31',
                text: 'The following is used as first line in simple partial seizures',

            // 32

                id: 'q32',
                text: 'Miss MK aged 21 ... seizure has now lasted 25 minutes ... Which drug would you prescribe for this patient?',

        // ─── RENDER MCQs ───

            html += `<p><span class="q-badge">${q.id.replace('q','')}</span> ${q.text}</p>`;
            html += `<div class="options">`;
            q.options.forEach((opt, idx) => {
                const val = String.fromCharCode(97 + idx);
                html += `<label><input type="radio" name="${q.id}" value="${val}"> ${opt}</label>`;
            });
            html += `</div>`;
            html += `<div class="question-feedback" id="mcq-feedback-${q.id}"></div>`;
            html += `</div>`;
        });
        html += '</form>';
        container.innerHTML = html;

        // ─── SUBMIT MCQs ───
        function submitMCQs() {
            let earned = 0;
            const total = mcqData.length;

            mcqData.forEach(q => {
                const radios = document.querySelectorAll(`#mcqForm input[name="${q.id}"]`);
                const selected = Array.from(radios).find(r => r.checked);
                const correct = q.correct;
                const feedbackEl = document.getElementById(`mcq-feedback-${q.id}`);
                let html = `<div class="answer-block"><strong>Q${q.id.replace('q','')}</strong><div class="answer-list">`;

                radios.forEach(r => {
                    const label = r.parentElement;
                    const text = label ? label.textContent.trim() : r.value;
                    const classes = ['answer-item'];
                    if (r.value === correct) classes.push('answer-correct');
                    if (r.checked && r.value !== correct) classes.push('answer-wrong', 'user-choice');
                    if (r.checked && r.value === correct) classes.push('user-choice');
                    html += `<div class="${classes.join(' ')}">${text}${r.checked ? ' ◀' : ''}</div>`;
                });
                html += `</div>`;
                const correctRadio = Array.from(radios).find(rr => rr.value === correct);
                const correctText = correctRadio ? correctRadio.parentElement.textContent.trim() : correct;
                let isCorrect = false;
                if (selected && selected.value === correct) {
                    earned += 1;
                    isCorrect = true;
                }
                const status = isCorrect ? '✅ Correct' : '❌ Incorrect';
                const statusClass = isCorrect ? '' : 'wrong';
                html += `<div class="explanation ${statusClass}">${status}. Correct answer: <strong>${correctText}</strong>. ${q.explanation}</div>`;
                html += `</div>`;
                feedbackEl.innerHTML = html;
            });

            document.querySelectorAll('#mcqForm input[type="radio"]').forEach(i => i.disabled = true);
            const resultDiv = document.getElementById('mcqResult');
            resultDiv.style.display = 'block';
            document.getElementById('mcqScore').innerText = `${earned} / ${total}`;
        }

        // ─── KEYBOARD SUPPORT ───

            btn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    btn.click();
