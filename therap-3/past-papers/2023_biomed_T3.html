<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2023 Biomed Therapeutics Test 3 | Past Paper</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --primary: #1a6b6b;
            --accent: #2d9b9b;
            --dark: #0f2b2b;
            --light: #f6fafa;
            --radius: 12px;
            --shadow: 0 4px 14px rgba(10, 40, 40, 0.07);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", Roboto, system-ui, sans-serif;
            background: linear-gradient(180deg, #f0f6f6, #e4efef);
            color: var(--dark);
            min-height: 100vh;
            padding-top: 80px;
        }
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: linear-gradient(135deg, var(--primary), var(--dark));
            color: #fff;
            padding: 0.7rem 0;
            box-shadow: 0 6px 18px rgba(8,30,30,0.20);
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .logo i { font-size: 1.5rem; color: var(--accent); }
        .logo h1 {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            margin: 0;
            line-height: 1;
        }
        .badge {
            background: rgba(255,255,255,0.13);
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            color: #cae6e6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1.25rem 2.5rem;
        }
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            margin: 1.8rem 0 1rem 0;
            padding-bottom: 0.4rem;
            border-bottom: 3px solid rgba(26,107,107,0.18);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .section-title i { font-size: 1.1rem; color: var(--accent); }
        .section-title .count {
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--primary);
            color: #fff;
            border-radius: 40px;
            padding: 0.05rem 0.7rem;
        }
        .section-subtitle {
            color: #4f6f6f;
            font-size: 0.92rem;
            margin-bottom: 1.2rem;
        }
        .section-panel { display: block; }
        .question {
            background: #ffffff;
            border-radius: var(--radius);
            padding: 1.1rem 1.1rem 0.1rem 1.1rem;
            margin-bottom: 1.1rem;
            box-shadow: var(--shadow);
            border: 1px solid rgba(26,107,107,0.06);
        }
        .question:hover {
            box-shadow: 0 6px 22px rgba(10,40,40,0.07);
        }
        .question p {
            font-weight: 600;
            font-size: 0.97rem;
            margin-bottom: 0.5rem;
            color: var(--dark);
            line-height: 1.5;
        }
        .question .q-badge {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            border-radius: 40px;
            padding: 0 0.7rem;
            font-size: 0.7rem;
            font-weight: 700;
            line-height: 1.6;
            margin-right: 0.4rem;
        }
        .options label {
            display: block;
            background: #fafdfd;
            border: 1px solid #dde8ec;
            border-radius: 8px;
            padding: 0.4rem 0.85rem;
            margin-top: 0.4rem;
            cursor: pointer;
            transition: 0.15s ease;
            font-weight: 450;
            font-size: 0.93rem;
        }
        .options label:hover {
            background: #e6f3f3;
            border-color: var(--accent);
        }
        .options input[type="radio"] {
            margin-right: 0.5rem;
            accent-color: var(--primary);
            transform: scale(1.05);
        }
        .question-feedback {
            margin-top: 0.8rem;
            padding: 0.3rem 0 0.1rem 0;
            border-top: 1px dashed #d5e3e3;
        }
        .answer-block strong {
            display: block;
            margin-bottom: 4px;
            color: var(--primary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .answer-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .answer-item {
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #e3edf0;
            background: #fff;
            font-weight: 500;
            font-size: 0.88rem;
        }
        .answer-correct {
            background: #ebfaf3;
            border-color: #b5e6cc;
            color: #065f46;
        }
        .answer-wrong {
            background: #fdeeef;
            border-color: #f7b5b5;
            color: #8f1a2e;
        }
        .user-choice {
            outline: 2px dashed rgba(0,0,0,0.06);
        }
        .explanation {
            margin-top: 6px;
            padding: 7px 12px;
            border-radius: 8px;
            background: #f0f8f6;
            color: #065f46;
            font-size: 0.89rem;
            line-height: 1.5;
            border-left: 4px solid var(--accent);
        }
        .explanation.wrong {
            background: #fdf3f4;
            color: #6f1a1a;
            border-left-color: #e07a7a;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            color: #fff;
            border: none;
            padding: 0.6rem 1.6rem;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(26,107,107,0.25);
        }
        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(26,107,107,0.32);
        }
        .btn:active { transform: scale(0.96); }
        .btn i { font-size: 0.9rem; }
        .submit-wrap {
            text-align: center;
            margin: 1.5rem 0 2rem;
        }
        .result {
            margin-top: 1.5rem;
            padding: 1.5rem 1.5rem 1rem;
            background: #eff8f7;
            border-radius: var(--radius);
            text-align: center;
            display: none;
            border: 1px solid #bddcd9;
        }
        .result h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.2rem;
        }
        .score {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--primary);
            margin: 0.2rem 0 0.4rem;
        }
        @media (max-width: 700px) {
            body { padding-top: 72px; }
            .logo h1 { font-size: 0.95rem; }
            .header-inner { padding: 0 1rem; flex-direction: column; align-items: stretch; gap: 0.3rem; }
            .badge { align-self: flex-start; }
            .question { padding: 0.9rem 0.9rem 0.1rem 0.9rem; }
            .section-title { font-size: 1.1rem; }
            .score { font-size: 2.2rem; }
            .btn { padding: 0.5rem 1.2rem; font-size: 0.85rem; }
        }
        .text-muted { color: #4f6f6f; font-size: 0.9rem; }
        .mt-1 { margin-top: 0.8rem; }
        .hidden { display: none !important; }
        .scroll-target { scroll-margin-top: 90px; }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div class="logo">
                <i class="fas fa-capsules"></i>
                <h1>2023 Biomed Therapeutics Test 3</h1>
            </div>
            <span class="badge"><i class="fas fa-pencil-alt"></i> &nbsp;35 MCQs</span>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="section-title scroll-target">
                <i class="fas fa-list-ul"></i> Multiple Choice Questions
                <span class="count">35 marks</span>
            </div>
            <p class="section-subtitle">Select the best answer for each question, then click <strong>Submit All MCQs</strong>.</p>

            <div id="mcqContainer"></div>

            <div class="submit-wrap">
                <button type="button" class="btn" onclick="submitMCQs()">
                    <i class="fas fa-check-circle"></i> Submit All MCQs
                </button>
            </div>

            <div class="result" id="mcqResult">
                <h3><i class="fas fa-chart-simple"></i> Your Score</h3>
                <div class="score" id="mcqScore">0 / 35</div>
            </div>
        </div>
    </main>

    <script>
        // ─── MCQ DATA ───
        // Extracted from the PDF; for incomplete questions we've used sensible defaults.
        const mcqData = [
            // 1
            {
                id: 'q1',
                text: 'Which of the following is an example of a serious side effect of protease inhibitors?',
                options: ['A. Peripheral neuropathy', 'B. Insulin resistance', 'C. Bone marrow suppression', 'D. Renal toxicity', 'E. Hypersensitivity'],
                correct: 'b',
                explanation: 'Protease inhibitors cause metabolic syndrome including insulin resistance, dyslipidemia, and lipodystrophy.'
            },
            // 2
            {
                id: 'q2',
                text: 'A truck driver ... urine has been brownish or orange. Which drug is most likely the cause?',
                options: ['A. Rifampicin', 'B. Pyrazinamide', 'C. Isoniazid', 'D. Ethambutol', 'E. Levofloxacin'],
                correct: 'a',
                explanation: 'Rifampicin causes red-orange discoloration of urine, tears, and other body fluids – harmless but alarming.'
            },
            // 3
            {
                id: 'q3',
                text: 'Which drug is the most effective against Cytomegalovirus among heart transplant patients?',
                options: ['A. Valaciclovir', 'B. Acyclovir', 'C. Valganciclovir', 'D. Ganciclovir', 'E. Tenofovir'],
                correct: 'c',
                explanation: 'Valganciclovir is the oral prodrug of ganciclovir with excellent bioavailability, preferred for CMV prophylaxis and treatment in transplant patients.'
            },
            // 4
            {
                id: 'q4',
                text: 'Which of the following belong to Group D1 of the drugs used for management of MDR T.B?',
                options: ['A. Linezolid', 'B. High dose isoniazid', 'C. Cycloserine', 'D. Moxifloxacin', 'E. Bedaquiline'],
                correct: 'c',
                explanation: 'According to WHO classification, Group D1 includes cycloserine, ethambutol, and others. Linezolid, bedaquiline, and fluoroquinolones are Group A.'
            },
            // 5
            {
                id: 'q5',
                text: 'The following has excellent activity against Aspergillus species',
                options: ['A. Flucytosine', 'B. Caspofungin', 'C. Naftifine', 'D. Ciclopirox', 'E. Fluconazole'],
                correct: 'b',
                explanation: 'Caspofungin (echinocandin) has good activity against Aspergillus. Voriconazole is better but not listed.'
            },
            // 6
            {
                id: 'q6',
                text: 'Which of the following affects the joints and tendons and thus should only be considered for use in children when benefit outweighs risk?',
                options: ['A. Tetracycline', 'B. Sulfamethoxazole', 'C. Pyrimethamine', 'D. Levofloxacin', 'E. Gentamicin'],
                correct: 'd',
                explanation: 'Fluoroquinolones (like levofloxacin) can cause arthropathy and tendon damage in children; use only if benefits outweigh risks.'
            },
            // 7
            {
                id: 'q7',
                text: 'Which drug will need to be stopped way before a couple may embark on conceiving?',
                options: ['A. Itraconazole', 'B. Griseofulvin', 'C. Amphotericin B', 'D. Ketoconazole', 'E. Voriconazole'],
                correct: 'b',
                explanation: 'Griseofulvin is teratogenic and should be discontinued for at least 1 month (some say 6 months) before pregnancy.'
            },
            // 8
            {
                id: 'q8',
                text: 'The following are factors that determine toxicity affect EXCEPT',
                options: ['A. Route of exposure', 'B. Duration of exposure', 'C. Dose', 'D. Human factor', 'E. Brand of a chemical'],
                correct: 'e',
                explanation: 'Toxicity depends on dose, route, duration, and individual susceptibility – not the brand of the chemical.'
            },
            // 9
            {
                id: 'q9',
                text: 'Which of the following is known to be caused by Sulphonamides?',
                options: ['A. Pancreatitis', 'B. Crystalluria', 'C. Megaloblastic anaemia', 'D. CNS effects', 'E. Photosensitivity'],
                correct: 'b',
                explanation: 'Sulfonamides can precipitate in urine causing crystalluria. Megaloblastic anemia is due to trimethoprim (folate antagonist).'
            },
            // 10
            {
                id: 'q10',
                text: 'Patient M ... acute kidney failure on ART. Which drug is the culprit? (Tenofovir is the classic cause)',
                options: ['A. Tenofovir', 'B. Emtricitabine', 'C. Abacavir', 'D. Lamivudine', 'E. Didanosine'],
                correct: 'a',
                explanation: 'Tenofovir is a nucleotide reverse transcriptase inhibitor known to cause nephrotoxicity (proximal tubular dysfunction).'
            },
            // 11
            {
                id: 'q11',
                text: 'Valacyclovir can be used in all the following except',
                options: ['A. Herpes simplex', 'B. Varicella-zoster', 'C. Cytomegalovirus', 'D. Herpes labialis', 'E. Genital herpes'],
                correct: 'c',
                explanation: 'Valacyclovir is effective against HSV and VZV, but not against CMV (ganciclovir/valganciclovir are used for CMV).'
            },
            // 12
            {
                id: 'q12',
                text: 'Trifluridine can cause the following side effect',
                options: ['A. Headache', 'B. Lip edema', 'C. Pruritus', 'D. Herpetic lesions', 'E. Vomiting'],
                correct: 'c',
                explanation: 'Trifluridine (ophthalmic) causes local irritation, burning, and pruritus.'
            },
            // 13
            {
                id: 'q13',
                text: 'Which set of combinations is useful to treat conditions that may be resistant to either drug when used alone?',
                options: ['A. Foscarnet + Cidofovir', 'B. Foscarnet + Valganciclovir', 'C. Foscarnet + Acyclovir', 'D. Foscarnet + Ganciclovir', 'E. Foscarnet + Adefovir'],
                correct: 'd',
                explanation: 'Foscarnet + Ganciclovir combination is used for resistant CMV infections; they have synergistic activity.'
            },
            // 14
            {
                id: 'q14',
                text: 'The following indirectly or directly inhibit the formation of cell membrane Except',
                options: ['A. Terbinafine', 'B. Posaconazole', 'C. Caspofungin', 'D. Naftifine', 'E. Itraconazole'],
                correct: 'c',
                explanation: 'Caspofungin inhibits cell wall (β-glucan synthesis), not cell membrane. Terbinafine, azoles, and naftifine affect membrane synthesis.'
            },
            // 15
            {
                id: 'q15',
                text: 'Two weeks into ART treatment, patient has nightmares, incoherence, hallucinations. Which drug likely caused this?',
                options: ['A. Efavirenz', 'B. Dolutegravir', 'C. Raltegravir', 'D. Tenofovir', 'E. Lamivudine'],
                correct: 'a',
                explanation: 'Efavirenz is an NNRTI known for CNS side effects including vivid dreams, confusion, and hallucinations.'
            },
            // 16
            {
                id: 'q16',
                text: 'Which drug works against inhibition of final formation of folinic acids?',
                options: ['A. Sulfamethoxazole', 'B. Trimethoprim', 'C. Pyrimethamine', 'D. Methotrexate', 'E. All of the above'],
                correct: 'd',
                explanation: 'Methotrexate inhibits dihydrofolate reductase, blocking the formation of tetrahydrofolic acid (folinic acid). Trimethoprim and pyrimethamine also inhibit but at different enzymes.'
            },
            // 17
            {
                id: 'q17',
                text: 'Skin eruptions like burns, drug-induced. Which drug is most likely?',
                options: ['A. Cotrimoxazole', 'B. Amoxicillin', 'C. Ciprofloxacin', 'D. Gentamicin', 'E. Vancomycin'],
                correct: 'a',
                explanation: 'Cotrimoxazole (sulfamethoxazole/trimethoprim) is a common cause of severe skin reactions including Stevens-Johnson syndrome and toxic epidermal necrolysis.'
            },
            // 18
            {
                id: 'q18',
                text: 'Which of the following is used in the management of Hepatitis C infections?',
                options: ['A. Ribavirin', 'B. Sofosbuvir', 'C. Interferon', 'D. Both A and B', 'E. All of the above'],
                correct: 'e',
                explanation: 'Ribavirin, sofosbuvir, and interferon are all used in Hepatitis C treatment (though direct-acting antivirals are now standard).'
            },
            // 19
            {
                id: 'q19',
                text: 'Cotrimoxazole can be used for the management of all the following conditions Except',
                options: ['A. Pneumocystis pneumonia', 'B. Urinary tract infections', 'C. Toxoplasmosis', 'D. Viral infections', 'E. Shigellosis'],
                correct: 'd',
                explanation: 'Cotrimoxazole is antibacterial and antiprotozoal; it is not effective against viruses.'
            },
            // 20
            {
                id: 'q20',
                text: 'Which is the most suitable for management or prevention infections related to burns?',
                options: ['A. Sulfacetamide', 'B. Sulfadiazine', 'C. Sulfadoxine', 'D. Sulfadimidine', 'E. Sulfamethoxazole'],
                correct: 'b',
                explanation: 'Silver sulfadiazine is used topically for burns to prevent infection.'
            },
            // 21
            {
                id: 'q21',
                text: 'In terms of cause and effect relationship, which can be confirmed through de-challenging and re-challenging?',
                options: ['A. Doubtful', 'B. Conditional', 'C. Definite', 'D. Possible', 'E. Probable'],
                correct: 'c',
                explanation: 'Re-challenge (re-exposure) confirms a definite cause-and-effect relationship, especially for adverse drug reactions.'
            },
            // 22
            {
                id: 'q22',
                text: 'The following compromises the cell membrane of the fungi',
                options: ['A. Nystatin', 'B. Terbinafine', 'C. Caspofungin', 'D. Fluconazole', 'E. Tolnaftate'],
                correct: 'a',
                explanation: 'Nystatin is a polyene antifungal that binds to ergosterol in the fungal cell membrane, creating pores.'
            },
            // 23
            {
                id: 'q23',
                text: 'Patient KL has acute pancreatitis, likely drug-induced. Which drug is strongly suspected?',
                options: ['A. Zidovudine', 'B. Lamivudine', 'C. Didanosine', 'D. Raltegravir', 'E. Abacavir'],
                correct: 'c',
                explanation: 'Didanosine (ddI) is well known to cause pancreatitis.'
            },
            // 24
            {
                id: 'q24',
                text: 'Patient with Hb of 7, which drug would you NOT consider?',
                options: ['A. Lamivudine', 'B. Zidovudine', 'C. Stavudine', 'D. Didanosine', 'E. Emtricitabine'],
                correct: 'b',
                explanation: 'Zidovudine (AZT) causes significant bone marrow suppression, leading to anaemia, neutropenia, and thrombocytopenia.'
            },
            // 25
            {
                id: 'q25',
                text: 'Which best describes toxicity?',
                options: ['A. The degree to which a substance can cause injury', 'B. Any effect of a chemical which is injurious', 'C. The ability to kill or injure', 'D. The nature of being poisonous', 'E. The inherent characteristic of a poison to cause harm'],
                correct: 'a',
                explanation: 'Toxicity is the degree to which a substance can cause harm (injury) to an organism.'
            },
            // 26
            {
                id: 'q26',
                text: 'When is it recommended to initiate anti-retroviral therapy?',
                options: ['A. CD4 cell count <500 cells/µL', 'B. Viral load >100,000 copies/mL', 'C. CD4 <500 (duplicate)', 'D. HIV positive test result', 'E. Kaposi\'s sarcoma'],
                correct: 'd',
                explanation: 'Current guidelines recommend ART for all HIV-positive individuals regardless of CD4 count – treat all.'
            },
            // 27
            {
                id: 'q27',
                text: 'Which among the hepatotoxic drugs causes the least of this effect?',
                options: ['A. Cycloserine', 'B. Pyrazinamide', 'C. Ethambutol', 'D. Rifampicin', 'E. Isoniazid'],
                correct: 'c',
                explanation: 'Ethambutol is not hepatotoxic; it is generally well tolerated. Rifampicin, isoniazid, and pyrazinamide can cause hepatotoxicity.'
            },
            // 28
            {
                id: 'q28',
                text: 'Which drug is used for management of anogenital warts?',
                options: ['A. Cidofovir', 'B. Foscarnet', 'C. Ganciclovir', 'D. Famciclovir', 'E. Valacyclovir'],
                correct: 'a',
                explanation: 'Cidofovir is an antiviral that can be used for refractory anogenital warts (though not first-line; other treatments like podophyllin are used). Among the options, cidofovir is most appropriate.'
            },
            // 29
            {
                id: 'q29',
                text: 'For Patient M with drug-induced kidney failure, which drug would you replace the culprit with?',
                options: ['A. Emtricitabine', 'B. Stavudine', 'C. Abacavir', 'D. Lamivudine', 'E. Didanosine'],
                correct: 'c',
                explanation: 'If Tenofovir caused nephrotoxicity, switching to Abacavir (or other NRTI with less renal toxicity) is appropriate.'
            },
            // 30
            {
                id: 'q30',
                text: 'Which drug is active against HIV strains resistant to NRTIs, PIs and Maraviroc?',
                options: ['A. Ritonavir', 'B. Enfuvirtide', 'C. Dolutegravir', 'D. Raltegravir', 'E. Indinavir'],
                correct: 'c',
                explanation: 'Dolutegravir is an integrase inhibitor with a high barrier to resistance and activity against many resistant strains.'
            },
            // 31
            {
                id: 'q31',
                text: 'The following drug\'s absorption can be affected by antacids',
                options: ['A. Fluconazole', 'B. Ketoconazole', 'C. Nystatin', 'D. Miconazole', 'E. Voriconazole'],
                correct: 'b',
                explanation: 'Ketoconazole requires acidic gastric pH for dissolution and absorption; antacids and PPIs reduce its bioavailability.'
            },
            // 32
            {
                id: 'q32',
                text: 'Which is an example of the principle of HIV drug resistance?',
                options: ['A. Resistance may fade but not disappear when a drug is stopped', 'B. Partial suppression promotes resistance', 'C. Resistance can be overcome by complete suppression', 'D. Flexibility is equal among all classes', 'E. None of the above'],
                correct: 'a',
                explanation: 'HIV resistance mutations can persist as archived mutations; they may fade but are not completely lost, leading to rapid reappearance upon re-exposure.'
            },
            // 33
            {
                id: 'q33',
                text: 'Which relates to the therapeutic pharmacological effect?',
                options: ['A. Dry mouth with anticholinergics', 'B. Respiratory depression with phenobarbitone', 'C. Constipation with codeine', 'D. Sedation with antihistamines', 'E. Gingival hyperplasia with phenytoin'],
                correct: 'd',
                explanation: 'Sedation is a therapeutic effect of antihistamines (used for insomnia or allergy relief). The others are side effects.'
            },
            // 34
            {
                id: 'q34',
                text: 'Famiclovir used in treatment of HSV achieves the following',
                options: ['A. Less effect on pain and symptoms', 'B. Prevention of replication when combined', 'C. Reduces the amount of viral shedding', 'D. Inhibition of HSV recurrences', 'E. Completely eradicates the virus'],
                correct: 'd',
                explanation: 'Famiclovir reduces the frequency of HSV recurrences and viral shedding, but does not eradicate latent virus.'
            },
            // 35
            {
                id: 'q35',
                text: 'Which drug inhibits the precursor of lanosterol?',
                options: ['A. Terbinafine', 'B. Tioconazole', 'C. Tolnaftate', 'D. Griseofulvin', 'E. Flucytosine'],
                correct: 'a',
                explanation: 'Terbinafine inhibits squalene epoxidase, reducing the formation of lanosterol (precursor of ergosterol).'
            }
        ];

        // ─── RENDER MCQs ───
        const container = document.getElementById('mcqContainer');
        let html = '<form id="mcqForm">';
        mcqData.forEach(q => {
            html += `<div class="question" id="mcq-${q.id}">`;
            html += `<p><span class="q-badge">${q.id.replace('q','')}</span> ${q.text}</p>`;
            html += `<div class="options">`;
            q.options.forEach((opt, idx) => {
                const val = String.fromCharCode(97 + idx);
                html += `<label><input type="radio" name="${q.id}" value="${val}"> ${opt}</label>`;
            });
            html += `</div>`;
            html += `<div class="question-feedback" id="mcq-feedback-${q.id}"></div>`;
            html += `</div>`;
        });
        html += '</form>';
        container.innerHTML = html;

        // ─── SUBMIT MCQs ───
        function submitMCQs() {
            let earned = 0;
            const total = mcqData.length;

            mcqData.forEach(q => {
                const radios = document.querySelectorAll(`#mcqForm input[name="${q.id}"]`);
                const selected = Array.from(radios).find(r => r.checked);
                const correct = q.correct;
                const feedbackEl = document.getElementById(`mcq-feedback-${q.id}`);
                let html = `<div class="answer-block"><strong>Q${q.id.replace('q','')}</strong><div class="answer-list">`;

                radios.forEach(r => {
                    const label = r.parentElement;
                    const text = label ? label.textContent.trim() : r.value;
                    const classes = ['answer-item'];
                    if (r.value === correct) classes.push('answer-correct');
                    if (r.checked && r.value !== correct) classes.push('answer-wrong', 'user-choice');
                    if (r.checked && r.value === correct) classes.push('user-choice');
                    html += `<div class="${classes.join(' ')}">${text}${r.checked ? ' ◀' : ''}</div>`;
                });
                html += `</div>`;
                const correctRadio = Array.from(radios).find(rr => rr.value === correct);
                const correctText = correctRadio ? correctRadio.parentElement.textContent.trim() : correct;
                let isCorrect = false;
                if (selected && selected.value === correct) {
                    earned += 1;
                    isCorrect = true;
                }
                const status = isCorrect ? '✅ Correct' : '❌ Incorrect';
                const statusClass = isCorrect ? '' : 'wrong';
                html += `<div class="explanation ${statusClass}">${status}. Correct answer: <strong>${correctText}</strong>. ${q.explanation}</div>`;
                html += `</div>`;
                feedbackEl.innerHTML = html;
            });

            document.querySelectorAll('#mcqForm input[type="radio"]').forEach(i => i.disabled = true);
            const resultDiv = document.getElementById('mcqResult');
            resultDiv.style.display = 'block';
            document.getElementById('mcqScore').innerText = `${earned} / ${total}`;
        }

        // ─── KEYBOARD SUPPORT ───
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    btn.click();
                }
            });
        });
    </script>
</body>
</html>
