<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2021 Therapeutics Test 3 | Past Paper</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ─────────── ROOT & RESET ─────────── */
        :root {
            --primary: #1a6b6b;
            --accent: #2d9b9b;
            --dark: #0f2b2b;
            --light: #f6fafa;
            --radius: 12px;
            --shadow: 0 4px 14px rgba(10, 40, 40, 0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Roboto, system-ui, sans-serif;
            background: linear-gradient(180deg, #f0f6f6, #e4efef);
            color: var(--dark);
            min-height: 100vh;
            padding-top: 80px;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: linear-gradient(135deg, var(--primary), var(--dark));
            color: #fff;
            padding: 0.7rem 0;
            box-shadow: 0 6px 18px rgba(8, 30, 30, 0.20);
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo i {
            font-size: 1.5rem;
            color: var(--accent);
        }

        .logo h1 {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            margin: 0;
            line-height: 1;
        }

        .badge {
            background: rgba(255, 255, 255, 0.13);
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            color: #cae6e6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1.25rem 2.5rem;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            margin: 1.8rem 0 1rem 0;
            padding-bottom: 0.4rem;
            border-bottom: 3px solid rgba(26, 107, 107, 0.18);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .section-title i {
            font-size: 1.1rem;
            color: var(--accent);
        }

        .section-title .count {
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--primary);
            color: #fff;
            border-radius: 40px;
            padding: 0.05rem 0.7rem;
        }

        .section-subtitle {
            color: #4f6f6f;
            font-size: 0.92rem;
            margin-bottom: 1.2rem;
        }

        .section-panel {
            display: block;
        }

        /* MCQ cards */
        .question {
            background: #ffffff;
            border-radius: var(--radius);
            padding: 1.1rem 1.1rem 0.1rem 1.1rem;
            margin-bottom: 1.1rem;
            box-shadow: var(--shadow);
            border: 1px solid rgba(26, 107, 107, 0.06);
        }

        .question:hover {
            box-shadow: 0 6px 22px rgba(10, 40, 40, 0.07);
        }

        .question p {
            font-weight: 600;
            font-size: 0.97rem;
            margin-bottom: 0.5rem;
            color: var(--dark);
            line-height: 1.5;
        }

        .question .q-badge {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            border-radius: 40px;
            padding: 0 0.7rem;
            font-size: 0.7rem;
            font-weight: 700;
            line-height: 1.6;
            margin-right: 0.4rem;
        }

        .options label {
            display: block;
            background: #fafdfd;
            border: 1px solid #dde8ec;
            border-radius: 8px;
            padding: 0.4rem 0.85rem;
            margin-top: 0.4rem;
            cursor: pointer;
            transition: all 0.15s ease;
            font-weight: 450;
            font-size: 0.93rem;
        }

        .options label:hover {
            background: #e6f3f3;
            border-color: var(--accent);
        }

        .options input[type="radio"] {
            margin-right: 0.5rem;
            accent-color: var(--primary);
            transform: scale(1.05);
        }

        .question-feedback {
            margin-top: 0.8rem;
            padding: 0.3rem 0 0.1rem 0;
            border-top: 1px dashed #d5e3e3;
        }

        .answer-block strong {
            display: block;
            margin-bottom: 4px;
            color: var(--primary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .answer-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .answer-item {
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #e3edf0;
            background: #ffffff;
            font-weight: 500;
            font-size: 0.88rem;
        }

        .answer-correct {
            background: #ebfaf3;
            border-color: #b5e6cc;
            color: #065f46;
        }

        .answer-wrong {
            background: #fdeeef;
            border-color: #f7b5b5;
            color: #8f1a2e;
        }

        .user-choice {
            outline: 2px dashed rgba(0, 0, 0, 0.06);
        }

        .explanation {
            margin-top: 6px;
            padding: 7px 12px;
            border-radius: 8px;
            background: #f0f8f6;
            color: #065f46;
            font-size: 0.89rem;
            line-height: 1.5;
            border-left: 4px solid var(--accent);
        }

        .explanation.wrong {
            background: #fdf3f4;
            color: #6f1a1a;
            border-left-color: #e07a7a;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            color: #fff;
            border: none;
            padding: 0.6rem 1.6rem;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(26, 107, 107, 0.25);
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(26, 107, 107, 0.32);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn i {
            font-size: 0.9rem;
        }

        .submit-wrap {
            text-align: center;
            margin: 1.5rem 0 2rem;
        }

        .result {
            margin-top: 1.5rem;
            padding: 1.5rem 1.5rem 1rem;
            background: #eff8f7;
            border-radius: var(--radius);
            text-align: center;
            display: none;
            border: 1px solid #bddcd9;
        }

        .result h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.2rem;
        }

        .score {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--primary);
            margin: 0.2rem 0 0.4rem;
        }

        @media (max-width: 700px) {
            body {
                padding-top: 72px;
            }
            .logo h1 {
                font-size: 0.95rem;
            }
            .header-inner {
                padding: 0 1rem;
                flex-direction: column;
                align-items: stretch;
                gap: 0.3rem;
            }
            .badge {
                align-self: flex-start;
            }
            .question {
                padding: 0.9rem 0.9rem 0.1rem 0.9rem;
            }
            .section-title {
                font-size: 1.1rem;
            }
            .score {
                font-size: 2.2rem;
            }
            .btn {
                padding: 0.5rem 1.2rem;
                font-size: 0.85rem;
            }
        }

        .text-muted {
            color: #4f6f6f;
            font-size: 0.9rem;
        }
        .hidden {
            display: none !important;
        }
        .scroll-target {
            scroll-margin-top: 90px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div class="logo">
                <i class="fas fa-capsules"></i>
                <h1>2021 Therapeutics Test 3</h1>
            </div>
            <span class="badge"><i class="fas fa-pencil-alt"></i> &nbsp;54 MCQs</span>
        </div>
    </header>

    <main>
        <section class="container section-panel" id="section-mcq">
            <div class="section-title scroll-target" id="mcq-top">
                <i class="fas fa-list-ul"></i> Section A – Multiple Choice Questions
                <span class="count">54</span>
            </div>
            <p class="section-subtitle">Select the best answer for each question, then click <strong>Submit All MCQs</strong>.</p>

            <div id="mcqContainer"></div>

            <div class="submit-wrap">
                <button type="button" class="btn" onclick="submitMCQ()">
                    <i class="fas fa-check-circle"></i> Submit All MCQs
                </button>
            </div>

            <div class="result" id="resultBox">
                <h3><i class="fas fa-chart-simple"></i> Your Score</h3>
                <div class="score" id="score">0%</div>
                <p class="text-muted">Review the feedback below each question.</p>
                <div id="answers"></div>
            </div>
        </section>
    </main>

    <script>
        // ─── MCQ DATA ───
        const mcqData = [
            // 1
            {
                id: 'q1',
                text: 'A child requires multiple minor surgical procedures in the nasopharynx. Which of the following drugs has high surface activity and vasoconstrictor actions that reduce bleeding in mucous membranes?',
                options: ['A. Benzocaine', 'B. Bupivacaine', 'C. Cocaine', 'D. Lidocaine'],
                correct: 'c',
                explanation: 'Cocaine is a local anesthetic with potent vasoconstrictor properties due to its inhibition of norepinephrine reuptake, reducing bleeding.'
            },
            // 2
            {
                id: 'q2',
                text: 'Antipsychotic drugs work by the following mechanism',
                options: [
                    'A. Blockade of D2 receptors in hypothalamus and pituitary gland',
                    'B. Blockade of D2 receptors in brain basal ganglia',
                    'C. Blockade of D2 receptors in brain mesolimbic system',
                    'D. Blockade of D2 receptors in brain\'s chemo-receptor trigger zone (CTZ)',
                    'E. Inhibition of glutamate'
                ],
                correct: 'c',
                explanation: 'The antipsychotic effect is primarily mediated by D2 receptor blockade in the mesolimbic pathway. Other pathways cause side effects.'
            },
            // 3
            {
                id: 'q3',
                text: 'The following is one of the commonest side effects of antipsychotic drugs',
                options: ['A. Extrapyramidal effects', 'B. Drowsiness and sedation', 'C. Gynecomastia', 'D. Amenorrhea', 'E. Depression'],
                correct: 'a',
                explanation: 'Extrapyramidal symptoms (EPS) are very common with typical antipsychotics due to D2 blockade in the nigrostriatal pathway.'
            },
            // 4
            {
                id: 'q4',
                text: 'The following is an example typical symptoms of depression',
                options: ['A. Hypochondriasis', 'B. Anxieties', 'C. Phobias', 'D. Weight loss', 'E. Obsessions'],
                correct: 'd',
                explanation: 'Weight loss is a somatic symptom of depression. The others are more characteristic of anxiety disorders or OCD.'
            },
            // 5
            {
                id: 'q5',
                text: 'The following are known as side effect of antipsychotic drugs <strong>except</strong>',
                options: ['A. Akathisia', 'B. Nausea and vomiting', 'C. Weight gain', 'D. Gynecomastia', 'E. Complication of depression'],
                correct: 'e',
                explanation: 'Complication of depression is not a side effect of antipsychotics. Akathisia, weight gain, gynecomastia, and nausea/vomiting are recognised side effects.'
            },
            // 6
            {
                id: 'q6',
                text: 'The following drug cause anticholinergic effects',
                options: ['A. Sertraline', 'B. Venlafaxine', 'C. Paroxetine', 'D. Amitriptyline'],
                correct: 'd',
                explanation: 'Amitriptyline (tricyclic antidepressant) has strong anticholinergic properties. SSRIs like sertraline, paroxetine have mild effects, but amitriptyline is the classic.'
            },
            // 7
            {
                id: 'q7',
                text: 'Botulinum causes the following',
                options: ['A. Excessive sweat', 'B. Dysphagia', 'C. Tremors', 'D. Bladder spasm', 'E. Increased lacrimation'],
                correct: 'b',
                explanation: 'Botulinum toxin causes muscle paralysis; dysphagia (difficulty swallowing) is a common effect due to weakness of pharyngeal muscles.'
            },
            // 8
            {
                id: 'q8',
                text: 'Which one of the following statements concerning proposed mechanisms of action of anticonvulsant drugs is <strong>false</strong>?',
                options: [
                    'A. Diazepam facilitates GABA- mediated inhibitory actions',
                    'B. Ethosuximide selectively blocks K+ ion channels in thalamic neurons',
                    'C. Phenobarbital has multiple actions, including enhancement of the effects of GABA, antagonism of glutamate receptors, and blockade of Na+ ion channels',
                    'D. Phenytoin prolongs the inactivated state of the Na+ ion channel'
                ],
                correct: 'b',
                explanation: 'Ethosuximide blocks T-type Ca2+ channels, not K+ channels. The other statements are correct.'
            },
            // 9
            {
                id: 'q9',
                text: 'Priapism is an established side effect of the following drug',
                options: ['A. Trazodone', 'B. Venlafaxine', 'C. Maprotiline', 'D. Clomipramine', 'E. Reboxetine'],
                correct: 'a',
                explanation: 'Trazodone is well known for causing priapism (prolonged painful erection) due to its alpha-adrenergic blocking properties.'
            },
            // 10
            {
                id: 'q10',
                text: 'Abnormal dreams are an established side effect of the following drug',
                options: ['A. Imipramine', 'B. Amitriptyline', 'C. Venlafaxine', 'D. Dapoxetine', 'E. Clomipramine'],
                correct: 'c',
                explanation: 'Venlafaxine (SNRI) is associated with vivid or abnormal dreams. SSRIs can also, but venlafaxine is a classic example.'
            },
            // 11
            {
                id: 'q11',
                text: 'Hypotension has been reported as a side effect of the following <strong>Except</strong>',
                options: ['A. Haloperidol', 'B. Chlorpromazine', 'C. Fluphenazine', 'D. Risperidone', 'E. Clozapine'],
                correct: 'a',
                explanation: 'Haloperidol has less alpha-blocking activity, so it causes less hypotension compared to the others. Chlorpromazine, clozapine, and risperidone have significant alpha-blockade.'
            },
            // 12
            {
                id: 'q12',
                text: 'Antipsychotic drugs should not be used in the following conditions <strong>Except</strong>',
                options: ['A. Manic phase of bipolar disorder', 'B. Known hypersensitivity', 'C. Comatose patients', 'D. Severely depressed patients', 'E. Parkinson\'s disease'],
                correct: 'a',
                explanation: 'Antipsychotics are used to treat mania in bipolar disorder, so it is an indication, not a contraindication.'
            },
            // 13
            {
                id: 'q13',
                text: 'Cheese and other lacto products should not be used with the following drugs',
                options: ['A. Imipramine', 'B. Phenelzine', 'C. Paroxetine', 'D. Amitriptyline', 'E. Fluoxetine'],
                correct: 'b',
                explanation: 'Phenelzine is an MAOI; tyramine in cheese can cause hypertensive crisis.'
            },
            // 14
            {
                id: 'q14',
                text: 'Stimulation of the following receptors will increase GIT motility',
                options: ['A. M3', 'B. α1', 'C. β1', 'D. β2', 'E. M1'],
                correct: 'a',
                explanation: 'M3 muscarinic receptors mediate smooth muscle contraction in the GI tract, increasing motility. M1 also, but M3 is the primary for motility.'
            },
            // 15
            {
                id: 'q15',
                text: 'This drug, which does not activate opioid receptors, has been proposed as a maintenance drug in treatment programs for opioid addicts; a single oral dose will block the effects of injected heroin for up to 48 hours',
                options: ['A. Amphetamine', 'B. Buprenorphine', 'C. Naloxone', 'D. Naltrexone'],
                correct: 'd',
                explanation: 'Naltrexone is a pure opioid antagonist with no agonist activity; it blocks heroin effects and is used for maintenance therapy.'
            },
            // 16
            {
                id: 'q16',
                text: 'Sympathetic stimulation of β2 receptors will trigger the following',
                options: ['A. Bronchodilation', 'B. Bronchoconstriction', 'C. Sweating', 'D. Salivation', 'E. Miosis'],
                correct: 'a',
                explanation: 'β2 receptors mediate bronchodilation. Bronchoconstriction is from parasympathetic (M3) or histamine.'
            },
            // 17
            {
                id: 'q17',
                text: 'Which one of the following statements about nalbuphine is accurate?',
                options: ['A. Activates mu receptors', 'B. Does not cause respiratory depression', 'C. Is nonsedating', 'D. Response to naloxone in overdose may be unreliable'],
                correct: 'd',
                explanation: 'Nalbuphine is a mixed agonist-antagonist; its effects may not be fully reversed by naloxone, making response unreliable in overdose.'
            },
            // 18
            {
                id: 'q18',
                text: 'Which one of the following statements about vigabatrin is accurate?',
                options: [
                    'A. Blocks neuronal reuptake of GABA',
                    'B. Drug of choice in absence seizures',
                    'C. Is established to be teratogenic in humans',
                    'D. Visual field defects occur in up to one-third of patients'
                ],
                correct: 'd',
                explanation: 'Vigabatrin causes irreversible visual field defects in about 30% of patients. It is not first-line for absence, and it inhibits GABA transaminase (not reuptake).'
            },
            // 19
            {
                id: 'q19',
                text: 'Withdrawal of antiseizure drugs can cause increased seizure frequency and severity. Withdrawal is least likely to be a problem with',
                options: ['A. Clonazepam', 'B. Diazepam', 'C. Ethosuximide', 'D. Phenobarbital'],
                correct: 'c',
                explanation: 'Ethosuximide has a lower risk of withdrawal seizures compared to benzodiazepines and barbiturates.'
            },
            // 20
            {
                id: 'q20',
                text: 'The following causes extrapyramidal effects <strong>except</strong>',
                options: ['A. Fluphenazine', 'B. Olanzapine', 'C. Haloperidol', 'D. Chlorpromazine', 'E. Trifluoperazine'],
                correct: 'b',
                explanation: 'Olanzapine is an atypical antipsychotic with a lower risk of EPS compared to typical agents (fluphenazine, haloperidol, chlorpromazine, trifluoperazine).'
            },
            // 21
            {
                id: 'q21',
                text: '9-year-old child is having learning difficulties at school. He has brief lapses of awareness with eyelid fluttering that occur every 5-10 minutes. EEG studies reveal brief 3-Hz spike and wave discharges appearing synchronously in all leads. Which one of the following drugs would be effective in this child but has the disadvantages of causing sedation and tolerance?',
                options: ['A. Clonazepam', 'B. Diazepam', 'C. Ethosuximide', 'D. Phenobarbital'],
                correct: 'a',
                explanation: 'Clonazepam is effective for absence seizures but causes sedation and tolerance. Ethosuximide is first-line but does not cause significant sedation/tolerance.'
            },
            // 22
            {
                id: 'q22',
                text: 'You are on your way to take an examination and you suddenly get an attack of diarrhea. If you stop at a nearby drugstore for an over-the-counter opioid with antidiarrheal action, you will be asking for',
                options: ['A. Codeine', 'B. Dextromethorphan', 'C. Diphenoxylate', 'D. Loperamide'],
                correct: 'd',
                explanation: 'Loperamide is an OTC opioid that does not cross the blood-brain barrier, used for diarrhea. Diphenoxylate requires a prescription in many countries.'
            },
            // 23
            {
                id: 'q23',
                text: 'Tourette\'s syndrome can be treated with the following drug',
                options: ['A. Fluphenazine', 'B. Olanzapine', 'C. Chlorpromazine', 'D. Risperidone', 'E. Haloperidol'],
                correct: 'e',
                explanation: 'Haloperidol is a classic antipsychotic used for Tourette\'s syndrome. Other atypical antipsychotics are also used, but haloperidol is a well-established choice.'
            },
            // 24
            {
                id: 'q24',
                text: 'Stimulation of the following pair of receptors will promote male erection and ejaculation respectively',
                options: ['A. M3 and α1', 'B. β1 and M2', 'C. M3 and β1', 'D. α1 and β1', 'E. M1 and β2'],
                correct: 'a',
                explanation: 'Erection is mediated by parasympathetic (M3) and ejaculation by sympathetic (α1).'
            },
            // 25
            {
                id: 'q25',
                text: 'The following drug inhibits the metabolism of biogenic amines like serotonin and noradrenaline',
                options: ['A. Tranylcypromine', 'B. Fluoxetine', 'C. Imipramine', 'D. Fluvoxamine', 'E. Phenelzine'],
                correct: 'a',
                explanation: 'Tranylcypromine (and phenelzine) are MAOIs that inhibit metabolism of monoamines. Both are correct, but tranylcypromine is one of the options.'
            },
            // 26
            {
                id: 'q26',
                text: 'Renin secretion can be achieved by stimulating the following receptors',
                options: ['A. β3', 'B. M3', 'C. α2', 'D. α1', 'E. β1'],
                correct: 'e',
                explanation: 'β1 receptors on juxtaglomerular cells stimulate renin release. β2 also, but β1 is primary.'
            },
            // 27
            {
                id: 'q27',
                text: 'Antipsychotic drugs are not recommended in all the following group <strong>EXCEPT</strong>',
                options: ['A. Severely depressed patients', 'B. Severe hypotension or hypertension', 'C. Liver impairment', 'D. Manic patients', 'E. Comatose patients'],
                correct: 'd',
                explanation: 'Manic patients are treated with antipsychotics, so it is not a contraindication. The others are relative or absolute contraindications.'
            },
            // 28
            {
                id: 'q28',
                text: 'Nasal vasoconstriction can be enhanced by stimulation of the following receptors',
                options: ['A. M2', 'B. M3', 'C. α1', 'D. β1', 'E. β2'],
                correct: 'c',
                explanation: 'α1 receptors mediate vasoconstriction in nasal mucosa, used in decongestants.'
            },
            // 29
            {
                id: 'q29',
                text: 'The following is a non selective noradrenaline reuptake inhibitor',
                options: ['A. Maprotiline', 'B. Fluoxetine', 'C. Fluvoxamine', 'D. Sertraline', 'E. Trazodone'],
                correct: 'a',
                explanation: 'Maprotiline is a tetracyclic antidepressant that inhibits norepinephrine reuptake. It is considered a non-selective NRI compared to more selective agents.'
            },
            // 30
            {
                id: 'q30',
                text: 'The following statements true <strong>EXCEPT</strong>',
                options: [
                    'A. Anticholinergics do not worsen psychotic symptoms neither do they increase tardive dyskinesia',
                    'B. Combination of antipsychotic and alcohol enhances additive CNS depression',
                    'C. Anticholinergics reduce the therapeutic effects of Antipsychotics',
                    'D. Clozapine synergistic with other drugs that suppress bone marrow',
                    'E. Drugs that reduce renal clearance increase risk of Lithium toxicity'
                ],
                correct: 'c',
                explanation: 'Anticholinergics do not reduce the therapeutic efficacy of antipsychotics; they are used to treat EPS. So this statement is false, making it the exception.'
            },
            // 31
            {
                id: 'q31',
                text: 'Refractory schizophrenia can best be treated with the following drug',
                options: ['A. Olanzapine', 'B. Risperidone', 'C. Haloperidol', 'D. Fluphenazine', 'E. Clozapine'],
                correct: 'e',
                explanation: 'Clozapine is the drug of choice for treatment-resistant schizophrenia.'
            },
            // 32
            {
                id: 'q32',
                text: 'The following are atypical antipsychotics <strong>except</strong>',
                options: ['A. Haloperidol', 'B. Olanzapine', 'C. Risperidone', 'D. Clozapine'],
                correct: 'a',
                explanation: 'Haloperidol is a typical antipsychotic; the others are atypicals.'
            },
            // 33
            {
                id: 'q33',
                text: 'Parasympathetic stimulation of M3 and M2 receptors will result in the following',
                options: ['A. Mydriasis', 'B. Vasodilatation', 'C. Inhibition of lacrimation', 'D. Mucus secretion', 'E. Bronchodilation'],
                correct: 'd',
                explanation: 'M3 receptor stimulation causes glandular secretion (mucus). M2 is presynaptic, but overall parasympathetic effects include secretion and smooth muscle contraction.'
            },
            // 34
            {
                id: 'q34',

        // ─── RENDER MCQ ───
        const container = document.getElementById('mcqContainer');
        let html = '<form id="quizForm">';
        mcqData.forEach(q => {
            html += `<div class="question" id="q-${q.id}">`;
            html += `<p><span class="q-badge">${q.id.replace('q','')}</span> ${q.text}</p>`;
            html += `<div class="options">`;
            q.options.forEach((opt, idx) => {
                const val = String.fromCharCode(97 + idx); // a, b, c...
                html += `<label><input type="radio" name="${q.id}" value="${val}"> ${opt}</label>`;
            });
            html += `</div>`;
            html += `<div class="question-feedback" id="feedback-${q.id}"></div>`;
            html += `</div>`;
        });
        html += '</form>';
        container.innerHTML = html;

        // ─── MCQ CORRECT ANSWERS ───
        const correctMap = {};
        mcqData.forEach(q => { correctMap[q.id] = q.correct; });

        // ─── MCQ SUBMIT ───
        function submitMCQ() {
            let score = 0;
            const total = mcqData.length;

            mcqData.forEach(q => {
                const radios = document.querySelectorAll(`input[name="${q.id}"]`);
                const selected = Array.from(radios).find(r => r.checked);
                const correct = correctMap[q.id];
                const feedbackEl = document.getElementById(`feedback-${q.id}`);
                let html = `<div class="answer-block"><strong>Q${q.id.replace('q','')}</strong><div class="answer-list">`;

                radios.forEach(r => {
                    const label = r.parentElement;
                    const text = label ? label.textContent.trim() : r.value;
                    const classes = ['answer-item'];
                    if (r.value === correct) classes.push('answer-correct');
                    if (r.checked && r.value !== correct) classes.push('answer-wrong', 'user-choice');
                    if (r.checked && r.value === correct) classes.push('user-choice');
                    html += `<div class="${classes.join(' ')}">${text}${r.checked ? ' ◀' : ''}</div>`;
                });

                html += `</div>`;
                const correctRadio = Array.from(radios).find(rr => rr.value === correct);
                const correctText = correctRadio ? correctRadio.parentElement.textContent.trim() : correct;
                if (selected) {
                    if (selected.value === correct) {
                        html += `<div class="explanation">✅ Correct — ${q.explanation}</div>`;
                        score++;
                    } else {
                        html += `<div class="explanation wrong">❌ Incorrect. Correct answer: <strong>${correctText}</strong>. ${q.explanation}</div>`;
                    }
                } else {
                    html += `<div class="explanation wrong">No answer selected. Correct answer: <strong>${correctText}</strong>. ${q.explanation}</div>`;
                }
                html += `</div>`;
                feedbackEl.innerHTML = html;
            });

            const percentage = Math.round((score / total) * 100);
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'block';
            document.getElementById('score').innerText = percentage + '%';
            document.querySelectorAll('#quizForm input[type="radio"]').forEach(i => i.disabled = true);
        }

        // ─── KEYBOARD SUPPORT ───
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    btn.click();
                }
            });
