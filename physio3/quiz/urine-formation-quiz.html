<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizMaster · Renal Physiology — Urine Formation</title>
    <style>
        /* ----- custom properties ----- */
        :root {
            --primary: #1a6e7a;
            --accent: #2fa8a0;
            --dark: #0f2a2e;
            --light: #f4f9fa;
            --radius: 12px;
            --shadow: 0 4px 14px rgba(10, 40, 50, 0.08);
            --text: #1a2e36;
            --text-muted: #4d6a74;
            --border: #c8dce4;
            --bg-card: #ffffff;
            --bg-soft: #eaf3f6;
            --success: #1a6e7a;
            --danger: #a54040;
            --warning: #a07a1a;
        }

        /* ----- reset & base ----- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 28px 18px;
            color: var(--dark);
        }
        #app {
            max-width: 1024px;
            width: 100%;
            background: var(--text-muted);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 32px 36px 40px;
            transition: 0.3s;
            border: 1px solid rgba(26, 110, 122, 0.08);
        }
        @media (max-width: 640px) {
            #app {
                padding: 18px 14px 24px;
                border-radius: 10px;
            }
        }

        /* ----- typography ----- */
        h1,
        h2,
        h3,
        h4 {
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .text-muted {
            color: var(--text-muted);
        }

        /* ----- header ----- */
        .app-header {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex-direction: column;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 2px solid rgba(26, 110, 122, 0.12);
            padding-bottom: 18px;
            margin-bottom: 22px;
        }
        .app-header h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-header h1 span {
            background: var(--primary);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            padding: 2px 12px;
            border-radius: 40px;
            letter-spacing: 0.3px;
        }
        .app-header .badge {
            background: var(--bg-soft);
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: var(--primary);
            border: 1px solid rgba(26, 110, 122, 0.15);
        }

        /* ----- breadcrumb ----- */
        .breadcrumb {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 14px;
            margin-bottom: 18px;
            font-size: 14px;
            font-weight: 500;
        }
        .breadcrumb .sep {
            color: var(--text-muted);
            user-select: none;
            opacity: 0.5;
        }
        .breadcrumb .crumb-link {
            background: none;
            border: none;
            color: var(--light);
            cursor: pointer;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            transition: background 0.2s;
            font-size: 14px;
        }
        .breadcrumb .crumb-link:hover {
            background: var(--bg-soft);
        }
        .breadcrumb .current {
            color: var(--dark);
            font-weight: 600;
        }
        .breadcrumb .current-dim {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* ----- cards ----- */
        .grid-2col {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 18px;
            margin-top: 6px;
        }
        .grid-3col {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            margin-top: 6px;
        }
        .card {
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 16px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: var(--shadow);
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 12px 32px rgba(26, 110, 122, 0.13);
        }
        .card .icon {
            font-size: 36px;
            display: block;
            margin-bottom: 6px;
        }
        .card .name {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
        }
        .card .sub {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .card.level-easy .label {
            color: var(--primary);
        }
        .card.level-medium .label {
            color: #b07a1a;
        }
        .card.level-challenging .label {
            color: var(--danger);
        }
        .card .label {
            font-size: 17px;
            font-weight: 700;
        }

        /* ----- quiz header ----- */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }
        .quiz-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
        }
        .quiz-header .progress {
            background: var(--bg-soft);
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: var(--primary);
            border: 1px solid rgba(26, 110, 122, 0.12);
        }
        .quiz-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }
        .quiz-meta span {
            background: var(--bg-soft);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .quiz-meta span strong {
            color: var(--dark);
            font-weight: 600;
        }

        /* ----- question blocks (MCQ) ----- */
        .q-block {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 18px 22px 20px;
            margin-bottom: 16px;
            border: 1.5px solid var(--border);
            transition: 0.2s;
            box-shadow: var(--shadow);
        }
        .q-block.correct {
            border-color: var(--primary);
            background: #ecf6f5;
        }
        .q-block.wrong {
            border-color: var(--danger);
            background: #fdf2f2;
        }
        .q-block .q-head {
            display: flex;
            gap: 10px;
            align-items: baseline;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .q-block .q-head .num {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 14px;
            min-width: 38px;
        }
        .q-block .q-text {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 12px;
            color: var(--text);
        }
        .q-block .q-text code {
            background: var(--bg-soft);
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* options (MCQ) */
        .options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .opt {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            cursor: pointer;
            transition: 0.18s;
            font-size: 14px;
        }
        .opt:hover:not(.disabled) {
            border-color: var(--primary);
            background: var(--bg-soft);
        }
        .opt input[type="radio"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .opt .letter {
            font-weight: 600;
            color: var(--text-muted);
            min-width: 24px;
            font-size: 14px;
        }
        .opt .opt-text {
            flex: 1;
        }
        .opt.correct-opt {
            border-color: var(--primary);
            background: #ecf6f5;
        }
        .opt.correct-opt .letter {
            color: var(--primary);
        }
        .opt.wrong-opt {
            border-color: var(--danger);
            background: #fdf2f2;
        }
        .opt.wrong-opt .letter {
            color: var(--danger);
        }
        .opt.disabled {
            cursor: default;
            opacity: 0.85;
        }
        .opt.disabled:hover {
            border-color: var(--border);
            background: var(--bg-card);
        }
        .opt.correct-opt.disabled:hover {
            border-color: var(--primary);
            background: #ecf6f5;
        }
        .opt.wrong-opt.disabled:hover {
            border-color: var(--danger);
            background: #fdf2f2;
        }

        /* ----- essay (scenario sub-questions) ----- */
        .essay-block {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 18px 22px 20px;
            margin-bottom: 14px;
            border: 1.5px solid var(--border);
            box-shadow: var(--shadow);
            transition: 0.2s;
        }
        .essay-block.submitted {
            border-color: var(--primary);
            background: #f6fbfa;
        }
        .essay-block .e-head {
            display: flex;
            gap: 10px;
            align-items: baseline;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .essay-block .e-head .num {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 14px;
            min-width: 38px;
        }
        .essay-block .e-question {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 12px;
            color: var(--text);
        }
        .essay-block textarea {
            width: 100%;
            min-height: 90px;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            transition: 0.2s;
            background: var(--bg-card);
            color: var(--text);
        }
        .essay-block textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 110, 122, 0.12);
        }
        .essay-block textarea:disabled {
            background: var(--bg-soft);
            opacity: 0.8;
            cursor: not-allowed;
        }
        .essay-block .model-answer {
            margin-top: 14px;
            padding: 14px 18px;
            border-radius: 10px;
            background: var(--bg-soft);
            border-left: 4px solid var(--primary);
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
        }
        .essay-block .model-answer strong {
            color: var(--primary);
        }
        .essay-block .user-answer-display {
            margin-top: 10px;
            padding: 12px 16px;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
            white-space: pre-wrap;
        }
        .essay-block .user-answer-display .label {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 13px;
            display: block;
            margin-bottom: 4px;
        }
        .essay-block .badge-essay {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--primary);
            background: rgba(26, 110, 122, 0.10);
            padding: 2px 12px;
            border-radius: 40px;
            margin-left: 6px;
        }

        /* ----- explanation (MCQ) ----- */
        .explain {
            margin-top: 12px;
            padding: 12px 18px;
            border-radius: 10px;
            background: var(--bg-soft);
            border-left: 4px solid var(--primary);
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
        }
        .explain strong {
            color: var(--primary);
        }

        /* ----- scenario wrapper ----- */
        .scenario-wrap {
            background: var(--bg-soft);
            border-radius: var(--radius);
            padding: 20px 24px 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .scenario-wrap .s-title {
            font-weight: 700;
            font-size: 17px;
            margin-bottom: 4px;
            color: var(--dark);
        }
        .scenario-wrap .s-body {
            background: var(--bg-card);
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 14px;
            line-height: 1.7;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            white-space: pre-wrap;
            margin-bottom: 16px;
            color: var(--text);
        }
        .scenario-wrap .s-body code {
            background: var(--bg-soft);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
        }
        .scenario-wrap .sub-label {
            font-weight: 600;
            font-size: 14px;
            color: var(--primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .scenario-wrap .sub-label .badge-essay {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--primary);
            background: rgba(26, 110, 122, 0.10);
            padding: 2px 12px;
            border-radius: 40px;
        }

        /* ----- buttons ----- */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
            justify-content: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 32px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            background: var(--bg-soft);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .btn-primary:hover {
            background: #145a64;
            border-color: #145a64;
            box-shadow: 0 8px 28px rgba(26, 110, 122, 0.30);
        }
        .btn-success {
            background: var(--accent);
            color: var(--dark);
            border-color: var(--accent);
        }
        .btn-success:hover {
            background: #25968e;
            border-color: #25968e;
            box-shadow: 0 8px 28px rgba(47, 168, 160, 0.30);
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--bg-soft);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ----- results ----- */
        .results-summary {
            background: var(--bg-soft);
            border-radius: var(--radius);
            padding: 24px 28px;
            border: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }
        .results-summary .big-score {
            font-size: 38px;
            font-weight: 700;
            color: var(--primary);
        }
        .results-summary .big-score small {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-muted);
        }
        .results-summary .stats {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .results-summary .stat {
            text-align: center;
        }
        .results-summary .stat .num {
            font-size: 22px;
            font-weight: 700;
        }
        .results-summary .stat .lbl {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .stat.correct .num {
            color: var(--primary);
        }
        .stat.wrong .num {
            color: var(--danger);
        }
        .stat.unanswered .num {
            color: var(--text-muted);
        }

        /* review items */
        .review-item {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 10px;
            border-left: 4px solid var(--border);
            box-shadow: var(--shadow);
        }
        .review-item.correct {
            border-left-color: var(--primary);
        }
        .review-item.wrong {
            border-left-color: var(--danger);
        }
        .review-item .r-head {
            display: flex;
            gap: 12px;
            align-items: baseline;
            flex-wrap: wrap;
        }
        .review-item .r-head .r-label {
            font-weight: 600;
            min-width: 50px;
            color: var(--text);
        }
        .review-item .r-head .r-status {
            margin-left: auto;
            font-weight: 600;
        }
        .review-item .r-detail {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .review-item .r-exp {
            font-size: 14px;
            color: var(--text);
            margin-top: 6px;
            background: var(--bg-soft);
            padding: 8px 14px;
            border-radius: 8px;
        }
        .review-item .r-essay-answer {
            font-size: 14px;
            color: var(--text);
            margin-top: 6px;
            background: var(--bg-card);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            white-space: pre-wrap;
        }
        .review-item .r-essay-answer .label {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 13px;
            display: block;
            margin-bottom: 3px;
        }

        .hidden {
            display: none !important;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .text-center {
            text-align: center;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* ----- responsive ----- */
        @media (max-width: 640px) {
            .q-block {
                padding: 14px 14px 16px;
            }
            .essay-block {
                padding: 14px 14px 16px;
            }
            .opt {
                padding: 8px 12px;
                font-size: 13px;
            }
            .results-summary {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .results-summary .stats {
                justify-content: center;
            }
            .app-header h1 {
                font-size: 20px;
            }
            .card {
                padding: 16px 12px;
            }
            .btn {
                padding: 9px 20px;
                font-size: 14px;
            }
            .scenario-wrap {
                padding: 14px 14px 18px;
            }
            .scenario-wrap .s-body {
                font-size: 13px;
                padding: 10px 12px;
            }
            #app {
                padding: 14px 10px 20px;
            }
            .essay-block textarea {
                min-height: 70px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- header -->
        <header class="app-header">
            <h1>🧬 Renal Physiology <span>Quiz</span></h1>
            <span class="badge" id="headerBadge">Choose a topic</span>
        </header>

        <!-- breadcrumb -->
        <!-- <nav class="breadcrumb" id="breadcrumb">
            <button class="crumb-link" data-goto="topics">🏠 Topics</button>
            <span class="sep">›</span>
            <span class="current" id="bcTopic">—</span>
            <span class="sep" id="bcSep">›</span>
            <span class="current" id="bcLevel">—</span>
        </nav> -->

        <!-- dynamic content -->
        <div id="content"></div>
    </div>

    <script>
        // ========================================================================
        //  DATA — Topics, Levels, Question Banks, Scenarios (from PDF lecture notes)
        // ========================================================================

        const TOPICS = [
            { id: 'glomerular_architecture', name: 'Glomerular Architecture & Filtration', icon: '🧪',
                desc: 'Ultrafiltration, Starling forces, GFR, clearance (slides 1–13)' },
            { id: 'tubular_contribution', name: 'Tubular Contribution to Urine Formation', icon: '🔄',
                desc: 'Transport max, proximal tubule, loop of Henle, handling patterns (slides 14+)' },
        ];

        const LEVELS = [
            { id: 'easy', label: 'Easy', emoji: '🌱', cls: 'level-easy' },
            { id: 'medium', label: 'Medium', emoji: '🔥', cls: 'level-medium' },
            { id: 'challenging', label: 'Challenging', emoji: '🚀', cls: 'level-challenging' },
        ];

        // ----- MCQ BANKS (topic → level → array of { q, opts, correct, exp }) -----
        const BANKS = {};

        // ============================================================
        //  TOPIC 1 — Glomerular Architecture & Filtration (slides 1–13)
        // ============================================================

        BANKS.glomerular_architecture = {

            // ---------- EASY ----------
            easy: [{
                q: 'Which three renal processes combine to form urine?',
                opts: ['Filtration, reabsorption, secretion', 'Filtration, digestion, excretion',
                    'Reabsorption, secretion, metabolism', 'Filtration, excretion, osmosis'
                ],
                correct: 0,
                exp: 'Urine formation = filtration – reabsorption + secretion. Filtration occurs at the glomerulus, reabsorption and secretion occur along the tubules.'
            }, {
                q: 'What is the equation for urinary excretion rate of a substance X?',
                opts: ['Ux × V = filtration – reabsorption + secretion', 'Ux × V = filtration + reabsorption – secretion',
                    'Ux × V = filtration × reabsorption', 'Ux × V = secretion – filtration'
                ],
                correct: 0,
                exp: 'Excretion rate = Ux × V = (filtered load) – (reabsorbed) + (secreted). This is the substance-specific net balance.'
            }, {
                q: 'What is the approximate glomerular capillary hydrostatic pressure?',
                opts: ['25–30 mmHg', '55–60 mmHg', '80–90 mmHg', '110–120 mmHg'],
                correct: 1,
                exp: 'Glomerular capillary hydrostatic pressure is approximately 55–60 mmHg, which drives ultrafiltration across the glomerular barrier.'

        // ========================================================================

        const state = {
            topic: null,

            questions: null, // { mcqs: [], scenarios: [] }

            view: 'topics',

        // ========================================================================
        //  HELPERS
        // ========================================================================

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getQuestions(topicId, levelId) {
            const mcqs = BANKS[topicId]?.[levelId] || [];
            const shuffledMcqs = shuffle([...mcqs]);
            const scenarios = SCENARIOS[topicId]?.[levelId] || [];
            const shuffledScenarios = shuffle([...scenarios]).slice(0, 2);
            const paddedScenarios = shuffledScenarios.map(sc => {
                const subqs = shuffle([...sc.subqs]).slice(0, 5);
                while (subqs.length < 5) {
                    subqs.push({
                        q: `Sub-question ${subqs.length + 1}: What is the correct approach?`,
                        modelAnswer: 'This is a generic model answer. Please replace with a real answer.'
                    });
                }
                return { ...sc, subqs };
            });
            return { mcqs: shuffledMcqs, scenarios: paddedScenarios };
        }

        function getTotalQuestions(q) {
            return q.mcqs.length + q.scenarios.reduce((s, sc) => s + sc.subqs.length, 0);
        }

        function getAnsweredCount() {
            return Object.keys(state.answers).length;
        }

        const content = document.getElementById('content');
        const bcTopic = document.getElementById('bcTopic');

        function render() {
            switch (state.view) {
                case 'topics':
                    renderTopics();

                case 'levels':
                    renderLevels();
                    break;
                case 'quiz':
                    renderQuiz();
                    break;
                case 'results':
                    renderResults();
                    break;
                default:
                    renderTopics();
            }

        }

                    state.questions = null;

        // ---- QUIZ ----
        function renderQuiz() {
            if (!state.topic || !state.level || !state.questions) return;
            const q = state.questions;
            const total = getTotalQuestions(q);
            const answered = getAnsweredCount();
            // Header badge: topic only
            headerBadge.textContent = `${state.topic.icon} ${state.topic.name}`;

            let html = `
                <div class="quiz-header">
                    <h2>${state.level.emoji} ${state.level.label}</h2>

                    <span>📖 <strong>${q.scenarios.length}</strong> Scenarios · <strong>${q.scenarios.reduce((s,sc) => s + sc.subqs.length, 0)}</strong> essay questions</span>
                </div>
                <div id="quizContainer">
            `;

            // ---- MCQs ----
            q.mcqs.forEach((mq, idx) => {
                const key = `q-${idx}`;
                const selected = state.answers[key] ?? null;
                const isCorrect = state.submitted ? selected === mq.correct : null;
                const blockCls = state.submitted ? (isCorrect ? 'correct' : 'wrong') : '';
                const statusIcon = state.submitted ? (isCorrect ? ' ✅' : ' ❌') : '';

                html += `
                    <div class="q-block ${blockCls}" data-key="${key}">
                        <div class="q-head">
                            <span class="num">Q${idx + 1}.</span>
                            <span>${mq.q}</span>
                            ${statusIcon}
                        </div>
                        <div class="options">
                            ${mq.opts.map((opt, oi) => {
                                const isSelected = selected === oi;
                                const isCorrectOpt = oi === mq.correct;
                                let cls = 'opt';
                                if (state.submitted) {
                                    if (isCorrectOpt) cls += ' correct-opt';
                                    if (isSelected && !isCorrectOpt) cls += ' wrong-opt';
                                    cls += ' disabled';
                                }
                                const letter = String.fromCharCode(65 + oi);
                                return `
                                    <label class="${cls}">
                                        <input type="radio" name="${key}" value="${oi}" ${isSelected ? 'checked' : ''} ${state.submitted ? 'disabled' : ''} />
                                        <span class="letter">${letter}.</span>
                                        <span class="opt-text">${opt}</span>
                                    </label>
                                `;
                            }).join('')}
                        </div>
                        ${state.submitted ? `
                            <div class="explain"><strong>💡 Explanation:</strong> ${mq.exp}</div>
                        ` : ''}
                    </div>
                `;
            });

            // ---- Scenarios (essay sub-questions) ----
            q.scenarios.forEach((sc, si) => {
                const sKey = `s-${si}`;
                html += `
                    <div class="scenario-wrap">
                        <div class="s-title">📖 Scenario ${si + 1}: ${sc.title}</div>
                        <div class="s-body">${sc.body}</div>

                sc.subqs.forEach((sq, qi) => {
                    const key = `${sKey}-${qi}`;
                    const userAnswer = state.answers[key] || '';
                    const isSubmitted = state.submitted;

                    html += `
                        <div class="essay-block ${isSubmitted ? 'submitted' : ''}" data-key="${key}">
                            <div class="e-head">
                                <span class="num">${qi + 1}.</span>
                                <span>${sq.q}</span>
                            </div>
                            ${!isSubmitted ? `

                                    <span class="label">📝 Your answer:</span>
                                    ${userAnswer || '(No answer provided)'}

                                <div class="model-answer">
                                    <strong>📌 Model answer:</strong> ${sq.modelAnswer}
                                </div>
                            `}
                        </div>
                    `;
                });
                html += `</div>`;
            });

            html += `
                </div>
                <div class="actions">
                    ${!state.submitted ? `
                        <button class="btn btn-primary" id="submitBtn">✅ Submit All Answers</button>
                    ` : `
                        <button class="btn btn-success" id="resultsBtn">📊 View Results</button>
                    `}
                    <button class="btn btn-outline" id="resetBtn">🔄 Reset</button>
                    <button class="btn btn-outline" id="backLevelsBtn">🔙 Levels</button>
                </div>
            `;

            content.innerHTML = html;

            // ---- Event listeners for radio buttons (MCQs) ----
            if (!state.submitted) {
                content.querySelectorAll('input[type="radio"]').forEach(input => {
                    input.addEventListener('change', (e) => {
                        const name = input.name;
                        const value = parseInt(input.value);
                        state.answers[name] = value;
                        updateProgress();
                    });
                });

                // ---- Event listeners for textareas (essay) ----
                content.querySelectorAll('.essay-block textarea').forEach(textarea => {
                    textarea.addEventListener('input', (e) => {
                        const name = textarea.name;
                        state.answers[name] = textarea.value;
                        updateProgress();
                    });
                });
            }

            // ---- Submit ----
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.addEventListener('click', () => {
                    const total = getTotalQuestions(state.questions);
                    const answered = getAnsweredCount();
                    if (answered < total) {
                        if (!confirm(`You answered ${answered} out of ${total}. Submit anyway?`)) return;
                    }
                    state.submitted = true;
                    render();
                });
            }

            // ---- Results ----
            const resultsBtn = document.getElementById('resultsBtn');
            if (resultsBtn) {
                resultsBtn.addEventListener('click', () => {
                    calculateResults();
                    state.view = 'results';
                    render();
                });

                    state.submitted = false;
                    state.results = null;
                    state.view = 'levels';
                    render();
                });
            }
        }

        function updateProgress() {
            const prog = document.querySelector('.progress');
            if (prog) {
                const total = getTotalQuestions(state.questions);
                const answered = getAnsweredCount();
                prog.textContent = `${answered} / ${total} answered`;

        // ---- RESULTS ----
        function calculateResults() {
            const q = state.questions;
            let total = 0,
                correct = 0,
                wrong = 0,
                unanswered = 0;
            const details = [];

            // MCQs
            q.mcqs.forEach((mq, idx) => {
                const key = `q-${idx}`;
                const selected = state.answers[key];
                const isCorrect = selected === mq.correct;
                total++;
                if (selected === undefined) { unanswered++;
                    details.push({ key, label: `Q${idx+1}`, type: 'mcq', selected, correct: mq.correct,
                        isCorrect: false, answered: false, text: mq.q, opts: mq.opts, exp: mq.exp }); } else if (
                    isCorrect) { correct++;
                    details.push({ key, label: `Q${idx+1}`, type: 'mcq', selected, correct: mq.correct,
                        isCorrect: true, answered: true, text: mq.q, opts: mq.opts, exp: mq.exp }); } else { wrong++;
                    details.push({ key, label: `Q${idx+1}`, type: 'mcq', selected, correct: mq.correct,
                        isCorrect: false, answered: true, text: mq.q, opts: mq.opts, exp: mq.exp }); }
            });

            // Scenarios (essay)
            q.scenarios.forEach((sc, si) => {
                sc.subqs.forEach((sq, qi) => {
                    const key = `s-${si}-${qi}`;
                    const userAnswer = state.answers[key] || '';
                    const answered = userAnswer.trim().length > 0;
                    total++;
                    if (!answered) { unanswered++;
                        details.push({ key, label: `S${si+1}-${qi+1}`, type: 'essay', userAnswer,
                            modelAnswer: sq.modelAnswer, answered: false, text: sq.q }); } else { correct++;
                        details.push({ key, label: `S${si+1}-${qi+1}`, type: 'essay', userAnswer,
                            modelAnswer: sq.modelAnswer, answered: true, text: sq.q }); }
                });
            });

            state.results = { total, correct, wrong, unanswered, details };
        }

            let html = `
                <div class="results-summary">

                        <div class="big-score">${pct}% <small>Score</small></div>

                    </div>
                </div>

            if (reviewBtn && reviewArea) {

                                        </div>
                                        <div class="r-exp">💡 ${d.exp}</div>
                                    </div>
                                `;
                            } else {
                                // Essay
                                const status = d.answered ? '✅' : '⏭️';
                                const cls = d.answered ? 'correct' : '';
                                rc += `
                                    <div class="review-item ${cls}">
                                        <div class="r-head">
                                            <span class="r-label">${d.label}</span>
                                            <span>${d.text}</span>
                                            <span class="r-status">${status}</span>
                                        </div>
                                        <div class="r-essay-answer">
                                            <span class="label">📝 Your answer:</span>
                                            ${d.userAnswer || '(No answer provided)'}
                                        </div>
                                        <div class="r-exp" style="margin-top:8px;">
                                            <strong>📌 Model answer:</strong> ${d.modelAnswer}
                                        </div>
                                    </div>
                                `;
                            }
                        });
                        reviewContent.innerHTML = rc;
                    } else {
                        reviewArea.classList.add('hidden');
                        reviewBtn.textContent = '🔍 Review Answers';
                    }
                });
            }

            // Retake
            const retakeBtn = document.getElementById('retakeBtn');
            if (retakeBtn) {
                retakeBtn.addEventListener('click', () => {
                    state.answers = {};
                    state.submitted = false;
                    state.results = null;
                    state.view = 'quiz';
                    render();
                });
            }

            // Back to topics
            const backTopicsBtn = document.getElementById('backTopicsBtn');
            if (backTopicsBtn) {
                backTopicsBtn.addEventListener('click', () => {
                    state.topic = null;
                    state.level = null;
                    state.questions = null;
                    state.answers = {};
                    state.submitted = false;
                    state.results = null;
                    state.view = 'topics';
                    headerBadge.textContent = 'Choose a topic';
                    render();
                });
            }
        }

        // ---- BREADCRUMB ----
        function updateBreadcrumb() {
            if (state.topic) {
                bcTopic.textContent = `${state.topic.icon} ${state.topic.name}`;
                bcSep.style.display = 'inline';
                if (state.level) {
                    bcLevel.textContent = `${state.level.emoji} ${state.level.label}`;
                } else {
                    bcLevel.textContent = '—';
                }
            } else {
                bcTopic.textContent = '—';
                bcSep.style.display = 'none';
                bcLevel.textContent = '—';
            }
        }

        // ========================================================================
        //  BREADCRUMB NAVIGATION
        // ========================================================================

        document.querySelectorAll('.crumb-link').forEach(btn => {
            btn.addEventListener('click', () => {
                const goto = btn.dataset.goto;
                if (goto === 'topics') {
                    state.topic = null;
                    state.level = null;
                    state.questions = null;
                    state.answers = {};
                    state.submitted = false;
                    state.results = null;
                    state.view = 'topics';
                    headerBadge.textContent = 'Choose a topic';
                    render();
                }
            });
        });

        // ========================================================================
        //  INIT
        // ========================================================================

        render();
    </script>

</body>
</html>
