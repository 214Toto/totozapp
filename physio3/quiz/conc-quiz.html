<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizMaster · Urine Concentration & Acid–Base</title>
    <style>
        /* ----- custom properties ----- */
        :root {
            --primary: #2b7a78;
            --accent: #3aafa9;
            --dark: #17252a;
            --light: #f8f9fa;
            --radius: 12px;
            --shadow: 0 4px 14px rgba(18, 38, 63, 0.06);
            --text: #1e2a3a;
            --text-muted: #5a6b7c;
            --border: #dce5ef;
            --bg-card: #ffffff;
            --bg-soft: #f2f6fc;
            --success: #2b7a78;
            --danger: #b53b3b;
            --warning: #b8860b;
        }

        /* ----- reset & base ----- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 28px 18px;
            color: var(--dark);
        }
        #app {
            max-width: 1024px;
            width: 100%;
            background: var(--text-muted);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 32px 36px 40px;
            transition: 0.3s;
            border: 1px solid rgba(43, 122, 120, 0.08);
        }
        @media (max-width: 640px) {
            #app {
                padding: 18px 14px 24px;
                border-radius: 10px;
            }
        }

        /* ----- typography ----- */
        h1,
        h2,
        h3,
        h4 {
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .text-muted {
            color: var(--text-muted);
        }

        /* ----- header ----- */
        .app-header {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex-direction: column;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 2px solid rgba(43, 122, 120, 0.12);
            padding-bottom: 18px;
            margin-bottom: 22px;
        }
        .app-header h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-header h1 span {
            background: var(--primary);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            padding: 2px 12px;
            border-radius: 40px;
            letter-spacing: 0.3px;
        }
        .app-header .badge {
            background: var(--bg-soft);
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: var(--primary);
            border: 1px solid rgba(43, 122, 120, 0.15);
        }

        /* ----- breadcrumb ----- */
        .breadcrumb {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 14px;
            margin-bottom: 18px;
            font-size: 14px;
            font-weight: 500;
        }
        .breadcrumb .sep {
            color: var(--text-muted);
            user-select: none;
            opacity: 0.5;
        }
        .breadcrumb .crumb-link {
            background: none;
            border: none;
            color: var(--light);
            cursor: pointer;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            transition: background 0.2s;
            font-size: 14px;
        }
        .breadcrumb .crumb-link:hover {
            background: var(--bg-soft);
        }
        .breadcrumb .current {
            color: var(--dark);
            font-weight: 600;
        }
        .breadcrumb .current-dim {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* ----- cards ----- */
        .grid-2col {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 18px;
            margin-top: 6px;
        }
        .grid-3col {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            margin-top: 6px;
        }
        .card {
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 16px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: var(--shadow);
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 12px 32px rgba(43, 122, 120, 0.13);
        }
        .card .icon {
            font-size: 36px;
            display: block;
            margin-bottom: 6px;
        }
        .card .name {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
        }
        .card .sub {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .card.level-easy .label {
            color: var(--primary);
        }
        .card.level-medium .label {
            color: #c07a2b;
        }
        .card.level-challenging .label {
            color: var(--danger);
        }
        .card .label {
            font-size: 17px;
            font-weight: 700;
        }

        /* ----- quiz header ----- */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }
        .quiz-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
        }
        .quiz-header .progress {
            background: var(--bg-soft);
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: var(--primary);
            border: 1px solid rgba(43, 122, 120, 0.12);
        }
        .quiz-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }
        .quiz-meta span {
            background: var(--bg-soft);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .quiz-meta span strong {
            color: var(--dark);
            font-weight: 600;
        }

        /* ----- question blocks (MCQ) ----- */
        .q-block {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 18px 22px 20px;
            margin-bottom: 16px;
            border: 1.5px solid var(--border);
            transition: 0.2s;
            box-shadow: var(--shadow);
        }
        .q-block.correct {
            border-color: var(--primary);
            background: #f0f8f7;
        }
        .q-block.wrong {
            border-color: var(--danger);
            background: #fdf3f3;
        }
        .q-block .q-head {
            display: flex;
            gap: 10px;
            align-items: baseline;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .q-block .q-head .num {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 14px;
            min-width: 38px;
        }
        .q-block .q-text {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 12px;
            color: var(--text);
        }
        .q-block .q-text code {
            background: var(--bg-soft);
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* options (MCQ) */
        .options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .opt {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            cursor: pointer;
            transition: 0.18s;
            font-size: 14px;
        }
        .opt:hover:not(.disabled) {
            border-color: var(--primary);
            background: var(--bg-soft);
        }
        .opt input[type="radio"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .opt .letter {
            font-weight: 600;
            color: var(--text-muted);
            min-width: 24px;
            font-size: 14px;
        }
        .opt .opt-text {
            flex: 1;
        }
        .opt.correct-opt {
            border-color: var(--primary);
            background: #f0f8f7;
        }
        .opt.correct-opt .letter {
            color: var(--primary);
        }
        .opt.wrong-opt {
            border-color: var(--danger);
            background: #fdf3f3;
        }
        .opt.wrong-opt .letter {
            color: var(--danger);
        }
        .opt.disabled {
            cursor: default;
            opacity: 0.85;
        }
        .opt.disabled:hover {
            border-color: var(--border);
            background: var(--bg-card);
        }
        .opt.correct-opt.disabled:hover {
            border-color: var(--primary);
            background: #f0f8f7;
        }
        .opt.wrong-opt.disabled:hover {
            border-color: var(--danger);
            background: #fdf3f3;
        }

        /* ----- essay (scenario sub-questions) ----- */
        .essay-block {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 18px 22px 20px;
            margin-bottom: 14px;
            border: 1.5px solid var(--border);
            box-shadow: var(--shadow);
            transition: 0.2s;
        }
        .essay-block.submitted {
            border-color: var(--primary);
            background: #f8fbfa;
        }
        .essay-block .e-head {
            display: flex;
            gap: 10px;
            align-items: baseline;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .essay-block .e-head .num {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 14px;
            min-width: 38px;
        }
        .essay-block .e-question {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 12px;
            color: var(--text);
        }
        .essay-block textarea {
            width: 100%;
            min-height: 90px;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            transition: 0.2s;
            background: var(--bg-card);
            color: var(--text);
        }
        .essay-block textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(43, 122, 120, 0.12);
        }
        .essay-block textarea:disabled {
            background: var(--bg-soft);
            opacity: 0.8;
            cursor: not-allowed;
        }
        .essay-block .model-answer {
            margin-top: 14px;
            padding: 14px 18px;
            border-radius: 10px;
            background: var(--bg-soft);
            border-left: 4px solid var(--primary);
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
        }
        .essay-block .model-answer strong {
            color: var(--primary);
        }
        .essay-block .user-answer-display {
            margin-top: 10px;
            padding: 12px 16px;
            border-radius: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
            white-space: pre-wrap;
        }
        .essay-block .user-answer-display .label {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 13px;
            display: block;
            margin-bottom: 4px;
        }
        .essay-block .badge-essay {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--primary);
            background: rgba(43, 122, 120, 0.10);
            padding: 2px 12px;
            border-radius: 40px;
            margin-left: 6px;
        }

        /* ----- explanation (MCQ) ----- */
        .explain {
            margin-top: 12px;
            padding: 12px 18px;
            border-radius: 10px;
            background: var(--bg-soft);
            border-left: 4px solid var(--primary);
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
        }
        .explain strong {
            color: var(--primary);
        }

        /* ----- scenario wrapper ----- */
        .scenario-wrap {
            background: var(--bg-soft);
            border-radius: var(--radius);
            padding: 20px 24px 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .scenario-wrap .s-title {
            font-weight: 700;
            font-size: 17px;
            margin-bottom: 4px;
            color: var(--dark);
        }
        .scenario-wrap .s-body {
            background: var(--bg-card);
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 14px;
            line-height: 1.7;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            white-space: pre-wrap;
            margin-bottom: 16px;
            color: var(--text);
        }
        .scenario-wrap .s-body code {
            background: var(--bg-soft);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
        }
        .scenario-wrap .sub-label {
            font-weight: 600;
            font-size: 14px;
            color: var(--primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .scenario-wrap .sub-label .badge-essay {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--primary);
            background: rgba(43, 122, 120, 0.10);
            padding: 2px 12px;
            border-radius: 40px;
        }

        /* ----- buttons ----- */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
            justify-content: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 32px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            background: var(--bg-soft);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .btn-primary:hover {
            background: #236a68;
            border-color: #236a68;
            box-shadow: 0 8px 28px rgba(43, 122, 120, 0.30);
        }
        .btn-success {
            background: var(--accent);
            color: var(--dark);
            border-color: var(--accent);
        }
        .btn-success:hover {
            background: #34a09c;
            border-color: #34a09c;
            box-shadow: 0 8px 28px rgba(58, 175, 169, 0.30);
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--bg-soft);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ----- results ----- */
        .results-summary {
            background: var(--bg-soft);
            border-radius: var(--radius);
            padding: 24px 28px;
            border: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }
        .results-summary .big-score {
            font-size: 38px;
            font-weight: 700;
            color: var(--primary);
        }
        .results-summary .big-score small {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-muted);
        }
        .results-summary .stats {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .results-summary .stat {
            text-align: center;
        }
        .results-summary .stat .num {
            font-size: 22px;
            font-weight: 700;
        }
        .results-summary .stat .lbl {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .stat.correct .num {
            color: var(--primary);
        }
        .stat.wrong .num {
            color: var(--danger);
        }
        .stat.unanswered .num {
            color: var(--text-muted);
        }

        /* review items */
        .review-item {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 10px;
            border-left: 4px solid var(--border);
            box-shadow: var(--shadow);
        }
        .review-item.correct {
            border-left-color: var(--primary);
        }
        .review-item.wrong {
            border-left-color: var(--danger);
        }
        .review-item .r-head {
            display: flex;
            gap: 12px;
            align-items: baseline;
            flex-wrap: wrap;
        }
        .review-item .r-head .r-label {
            font-weight: 600;
            min-width: 50px;
            color: var(--text);
        }
        .review-item .r-head .r-status {
            margin-left: auto;
            font-weight: 600;
        }
        .review-item .r-detail {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .review-item .r-exp {
            font-size: 14px;
            color: var(--text);
            margin-top: 6px;
            background: var(--bg-soft);
            padding: 8px 14px;
            border-radius: 8px;
        }
        .review-item .r-essay-answer {
            font-size: 14px;
            color: var(--text);
            margin-top: 6px;
            background: var(--bg-card);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            white-space: pre-wrap;
        }
        .review-item .r-essay-answer .label {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 13px;
            display: block;
            margin-bottom: 3px;
        }

        .hidden {
            display: none !important;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .text-center {
            text-align: center;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* ----- responsive ----- */
        @media (max-width: 640px) {
            .q-block {
                padding: 14px 14px 16px;
            }
            .essay-block {
                padding: 14px 14px 16px;
            }
            .opt {
                padding: 8px 12px;
                font-size: 13px;
            }
            .results-summary {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .results-summary .stats {
                justify-content: center;
            }
            .app-header h1 {
                font-size: 20px;
            }
            .card {
                padding: 16px 12px;
            }
            .btn {
                padding: 9px 20px;
                font-size: 14px;
            }
            .scenario-wrap {
                padding: 14px 14px 18px;
            }
            .scenario-wrap .s-body {
                font-size: 13px;
                padding: 10px 12px;
            }
            #app {
                padding: 14px 10px 20px;
            }
            .essay-block textarea {
                min-height: 70px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- header -->
        <header class="app-header">
            <h1>🧪 Urine Physiology <span>Quiz</span></h1>
            <span class="badge" id="headerBadge">Choose a topic</span>
        </header>

        <!-- breadcrumb -->
        <!-- <nav class="breadcrumb" id="breadcrumb">
            <button class="crumb-link" data-goto="topics">🏠 Topics</button>
            <span class="sep">›</span>
            <span class="current" id="bcTopic">—</span>
            <span class="sep" id="bcSep">›</span>
            <span class="current" id="bcLevel">—</span>
        </nav> -->

        <!-- dynamic content -->
        <div id="content"></div>
    </div>

    <script>
        // ========================================================================
        //  DATA — Topics, Levels, Question Banks, Scenarios (from PDF)
        // ========================================================================

        const TOPICS = [
            { id: 'core_concentration', name: 'Core Principles of Urine Concentration & Dilution', icon: '💧',
                desc: 'Medullary gradient · Countercurrent multiplier · ADH · Free-water clearance' },
            { id: 'acid_base', name: 'Acid–Base Balance & Renal Acidification', icon: '⚗️',
                desc: 'Net acid excretion · Type A intercalated cells · Titratable acid · RTA' },
        ];

        const LEVELS = [
            { id: 'easy', label: 'Easy', emoji: '🌱', cls: 'level-easy' },
            { id: 'medium', label: 'Medium', emoji: '🔥', cls: 'level-medium' },
            { id: 'challenging', label: 'Challenging', emoji: '🚀', cls: 'level-challenging' },
        ];

        // ========================================================================
        //  MCQ BANKS (topic → level → array of { q, opts, correct, exp })
        // ========================================================================

        const BANKS = {};

        // ---- TOPIC 1: Core Principles of Urine Concentration & Dilution ----
        BANKS.core_concentration = {

            // ----- EASY (20) -----
            easy: [{
                q: 'What range of urine osmolality can the kidney produce?',
                opts: ['5–10 mOsm/kg H₂O', '50–1200 mOsm/kg H₂O', '100–500 mOsm/kg H₂O', '300–600 mOsm/kg H₂O'],
                correct: 1,
                exp: 'The kidney can produce urine with osmolality from about 50 mOsm/kg (dilute) up to 1200 mOsm/kg (concentrated), a 20‑fold range.'
            }, {
                q: 'What is the "single effect" in the countercurrent multiplier?',
                opts: ['Active reabsorption of NaCl from the thick ascending limb', 'Passive water reabsorption in the collecting duct',
                    'Urea recycling in the inner medulla', 'ADH-mediated water permeability'
                ],
                correct: 0,
                exp: 'The single effect is the active transport of NaCl out of the thick ascending limb, creating a small osmotic gradient that is multiplied by countercurrent flow.'
            }, {
                q: 'Which nephron segment builds the medullary osmotic gradient?',
                opts: ['Proximal convoluted tubule', 'Loop of Henle', 'Distal convoluted tubule', 'Collecting duct'],
                correct: 1,

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getQuestions(topicId, levelId) {
            const mcqs = BANKS[topicId]?.[levelId] || [];
            const shuffledMcqs = shuffle([...mcqs]);
            const scenarios = SCENARIOS[topicId]?.[levelId] || [];
            const shuffledScenarios = shuffle([...scenarios]).slice(0, 2);
            const paddedScenarios = shuffledScenarios.map(sc => {
                const subqs = shuffle([...sc.subqs]).slice(0, 3);
                // ensure exactly 3 subqs
                while (subqs.length < 3) {
                    subqs.push({
                        q: `Sub-question ${subqs.length + 1}: What is the correct approach?`,
                        modelAnswer: 'This is a generic model answer. Please refer to the core principles.'
                    });
                }
                return { ...sc, subqs };
            });
            // ensure exactly 2 scenarios
            while (paddedScenarios.length < 2) {
                paddedScenarios.push({
                    title: 'Case: General Acid-Base Scenario',
                    body: 'A 50-year-old patient presents with symptoms of acid-base disturbance. Laboratory studies are pending.',
                    subqs: [
                        { q: 'What initial investigations would you order?',

                        { q: 'What is the first step in managing acid-base disorders?',
                            modelAnswer: 'Identify the primary disorder and any compensation, then address the underlying cause.' },
                        { q: 'What is the role of the kidney in acid-base compensation?',
                            modelAnswer: 'The kidney compensates by adjusting bicarbonate reabsorption, NH₄⁺ excretion, and titratable acid excretion.' }
                    ]
                });
            }
            return { mcqs: shuffledMcqs, scenarios: paddedScenarios };
        }

        function getTotalQuestions(q) {
            return q.mcqs.length + q.scenarios.reduce((s, sc) => s + sc.subqs.length, 0);

                        ` : `
                            <button class="btn btn-success" id="resultsBtn">📊 View Results</button>
                        `}
                        <button class="btn btn-outline" id="resetBtn">🔄 Reset</button>
                        <button class="btn btn-outline" id="backLevelsBtn">🔙 Levels</button>
                    </div>

            q.mcqs.forEach((mq, idx) => {

                    details.push({ key, label: `Q${idx+1}`, type: 'mcq', selected, correct: mq.correct,

                    details.push({ key, label: `Q${idx+1}`, type: 'mcq', selected, correct: mq.correct,
                        isCorrect: false, answered: true, text: mq.q, opts: mq.opts, exp: mq.exp }); }

            q.scenarios.forEach((sc, si) => {

            if (!state.results) calculateResults();
            const r = state.results;
            const pct = r.total > 0 ? Math.round((r.correct / r.total) * 100) : 0;
            headerBadge.textContent = `${state.topic.icon} Results`;

            let html = `
                    <div class="results-summary">
                        <div>
                            <div class="big-score">${pct}% <small>Score</small></div>
                            <div style="font-size:14px; color:var(--text-muted);">${r.correct} / ${r.total} correct</div>
                        </div>
                        <div class="stats">
                            <div class="stat correct"><div class="num">${r.correct}</div><div class="lbl">✅ Correct</div></div>
                            <div class="stat wrong"><div class="num">${r.wrong}</div><div class="lbl">❌ Wrong</div></div>
                            <div class="stat unanswered"><div class="num">${r.unanswered}</div><div class="lbl">⏭️ Unanswered</div></div>
                        </div>
                    </div>
                    <div style="display:flex; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
                        <button class="btn btn-primary" id="reviewToggleBtn">🔍 Review Answers</button>
                        <button class="btn btn-outline" id="retakeBtn">🔄 Retake</button>
                        <button class="btn btn-outline" id="backTopicsBtn">🏠 Topics</button>
                    </div>
                    <div id="reviewArea" class="hidden">
                        <hr style="border:1px solid var(--border); margin:16px 0;" />
                        <h3 style="margin-bottom:12px; color:var(--dark);">📋 Detailed Review</h3>
                        <div id="reviewContent"></div>
                    </div>
                `;

            content.innerHTML = html;

            // Review toggle
            const reviewBtn = document.getElementById('reviewToggleBtn');
            const reviewArea = document.getElementById('reviewArea');
            const reviewContent = document.getElementById('reviewContent');
            let reviewVisible = false;

            if (reviewBtn && reviewArea) {
                reviewBtn.addEventListener('click', () => {
                    reviewVisible = !reviewVisible;
                    if (reviewVisible) {
                        reviewArea.classList.remove('hidden');
                        reviewBtn.textContent = '🔍 Hide Review';
                        let rc = '';
                        r.details.forEach(d => {
                            if (d.type === 'mcq') {
                                const status = d.answered ? (d.isCorrect ? '✅' : '❌') : '⏭️';
                                const cls = d.answered ? (d.isCorrect ? 'correct' : 'wrong') : '';
                                rc += `
                                        <div class="review-item ${cls}">
                                            <div class="r-head">
                                                <span class="r-label">${d.label}</span>
                                                <span>${d.text}</span>
                                                <span class="r-status">${status}</span>
                                            </div>
                                            <div class="r-detail">
                                                Your answer: ${d.answered ? d.opts[d.selected] : '—'} &nbsp;|&nbsp; Correct: ${d.opts[d.correct]}
                                            </div>
                                            <div class="r-exp">💡 ${d.exp}</div>
                                        </div>
                                    `;
                            } else {
                                const status = d.answered ? '✅' : '⏭️';
                                const cls = d.answered ? 'correct' : '';
                                rc += `
                                        <div class="review-item ${cls}">
                                            <div class="r-head">
                                                <span class="r-label">${d.label}</span>
                                                <span>${d.text}</span>
                                                <span class="r-status">${status}</span>
                                            </div>
                                            <div class="r-essay-answer">
                                                <span class="label">📝 Your answer:</span>
                                                ${d.userAnswer || '(No answer provided)'}
                                            </div>
                                            <div class="r-exp" style="margin-top:8px;">
                                                <strong>📌 Model answer:</strong> ${d.modelAnswer}
                                            </div>
                                        </div>
                                    `;
                            }
                        });
                        reviewContent.innerHTML = rc;
                    } else {
                        reviewArea.classList.add('hidden');
                        reviewBtn.textContent = '🔍 Review Answers';
                    }
                });
            }

            // Retake
            const retakeBtn = document.getElementById('retakeBtn');
            if (retakeBtn) {
                retakeBtn.addEventListener('click', () => {
                    state.answers = {};
                    state.submitted = false;
                    state.results = null;
                    state.view = 'quiz';
                    render();
                });
            }

            // Back to topics
            const backTopicsBtn = document.getElementById('backTopicsBtn');
            if (backTopicsBtn) {
                backTopicsBtn.addEventListener('click', () => {
                    state.topic = null;
                    state.level = null;
                    state.questions = null;
                    state.answers = {};
                    state.submitted = false;
                    state.results = null;
                    state.view = 'topics';
                    headerBadge.textContent = 'Choose a topic';
                    render();
                });
            }
        }

        // ---- BREADCRUMB ----
        function updateBreadcrumb() {
            if (state.topic) {
                bcTopic.textContent = `${state.topic.icon} ${state.topic.name}`;
                bcSep.style.display = 'inline';
                if (state.level) {
                    bcLevel.textContent = `${state.level.emoji} ${state.level.label}`;
                } else {
                    bcLevel.textContent = '—';
                }
            } else {
                bcTopic.textContent = '—';
                bcSep.style.display = 'none';
                bcLevel.textContent = '—';
            }
        }

        // ========================================================================
        //  BREADCRUMB NAVIGATION
        // ========================================================================

        document.querySelectorAll('.crumb-link').forEach(btn => {
            btn.addEventListener('click', () => {
                const goto = btn.dataset.goto;
                if (goto === 'topics') {
                    state.topic = null;
                    state.level = null;
                    state.questions = null;
                    state.answers = {};
                    state.submitted = false;
                    state.results = null;
                    state.view = 'topics';
                    headerBadge.textContent = 'Choose a topic';
                    render();
                }
            });
        });

        // ========================================================================
        //  INIT
        // ========================================================================

        render();
    </script>

</body>
</html>
